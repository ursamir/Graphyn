[plugin]
name             = "wakeword-train"
version          = "0.1.0"
description      = "WakeWord training as plugin"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["wakeword", "wakeword", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "torch>=2.0",
    "tensorflow>=2.13",
]

runtime = "inprocess"
node_types = ["wakeword_train"]

[config_schema.wakeword_train]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
epochs = { type = "integer", title = "Epochs", default = 30, description = "Epochs." }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/models/wakeword", description = "Output path." }
