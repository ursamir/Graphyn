[plugin]
name             = "wakeword-feature-extract"
version          = "0.1.0"
description      = "WakeWord feature_extractor node"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["wakeword", "wakeword", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["wakeword_feature_extract"]

[config_schema.wakeword_feature_extract]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
n_mfcc = { type = "integer", title = "N mfcc", default = 40, description = "N mfcc." }
n_fft = { type = "integer", title = "N fft", default = 512, description = "N fft." }
hop_length = { type = "integer", title = "Hop length", default = 160, description = "Hop length." }
