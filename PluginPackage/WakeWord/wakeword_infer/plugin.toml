[plugin]
name             = "wakeword-infer"
version          = "0.1.0"
description      = "WakeWord realtime infer node"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["wakeword", "wakeword"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "tflite-runtime>=2.14",
    "onnxruntime>=1.16",
    "tensorflow>=2.13",
]

runtime = "inprocess"
node_types = ["wakeword_infer"]

[config_schema.wakeword_infer]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
model_path = { type = "string", title = "Model path", default = "", description = "Path to the logistic model JSON from wakeword_train (required unless stub=True)." }
threshold = { type = "number", title = "Threshold", default = 0.8, description = "Threshold." }
backend = { type = "string", title = "Backend", default = "auto", enum = ["auto", "logistic"], description = "Backend." }
n_mfcc = { type = "integer", title = "N mfcc", default = 40, description = "MFCC coefficients per frame when decoding raw audio (match wakeword_feature_extract; model JSON 'n_mfcc' wins)." }
