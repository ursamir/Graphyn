[plugin]
name             = "wakeword-infer"
version          = "2.0.0"
description      = "Detect a trained wake word in audio files: sliding windows through the mel + speech-embedding ONNX front end and the exported head (livekit-wakeword WakeWordModel)."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"
tags             = ["wakeword", "inference", "onnx", "detection", "livekit-wakeword"]

# Wraps livekit-wakeword (Apache-2.0). Isolated venv: torch is pre-installed CPU-only.
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "scipy>=1.11",
    "onnxruntime>=1.17",
    "livekit-wakeword>=0.2.1,<0.3",
]

runtime = "isolated"
node_types = ["wakeword_infer"]

[config_schema.wakeword_infer]
model_path = { type = "string", title = "Model (.onnx)", default = "", description = "Exported classifier; overrides the model port." }
use_int8 = { type = "boolean", title = "Use INT8", default = false, description = "Use the run's .int8.onnx when present." }
threshold = { type = "number", title = "Threshold", default = 0.0, description = "0 = the run's tuned threshold (else 0.5).", minimum = 0.0, maximum = 1.0 }
window_s = { type = "number", title = "Window (s)", default = 2.0, minimum = 1.3, maximum = 5.0 }
hop_s = { type = "number", title = "Hop (s)", default = 0.1, minimum = 0.08, maximum = 2.0 }
min_level_db = { type = "number", title = "Silence floor (dBFS)", default = -60.0, description = "Windows quieter than this score 0 (digital silence).", minimum = -120.0, maximum = 0.0 }
refractory_s = { type = "number", title = "Refractory (s)", default = 1.0, description = "Windows above threshold within this gap merge into one detection.", minimum = 0.0, maximum = 10.0 }
