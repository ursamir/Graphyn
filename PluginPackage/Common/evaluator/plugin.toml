[plugin]
name             = "evaluator"
version          = "1.0.0"
description      = "Evaluate trained models with accuracy, F1, ROC/AUC, confusion matrix, and fairness metrics."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "evaluation", "metrics", "common"]

dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

# Isolated venv extras (never installed into the host API image).
# tensorflow (CPU wheels) + keras + plotting libs install on isolated load.
# torch is skipped unless GRAPHYN_ISOLATED_INSTALL_TORCH=1.
optional_dependencies = [
    "tensorflow>=2.13",
    "keras>=3.0",
    "torch>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

runtime = "isolated"
node_types = ["evaluator"]

[config_schema.evaluator]
output_path = { type = "string", default = "workspace/artifacts/evaluation" }
plot_confusion_matrix = { type = "boolean", default = true }
plot_training_curves = { type = "boolean", default = true }
compute_roc = { type = "boolean", default = true }
compute_fairness = { type = "boolean", default = false }
fairness_attribute_key = { type = "string", default = "speaker_id" }
