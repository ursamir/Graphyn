[plugin]
name             = "evaluator"
version          = "1.0.0"
description      = "Evaluate trained models with accuracy, F1, ROC/AUC, confusion matrix, and fairness metrics."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "evaluation", "metrics", "common"]

dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

# Isolated venv extras (never installed into the host API image).
# tensorflow (CPU wheels) + keras + plotting libs install on isolated load.
# torch is skipped unless GRAPHYN_ISOLATED_INSTALL_TORCH=1.
optional_dependencies = [
    "tensorflow>=2.13",
    "keras>=3.0",
    "torch>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

runtime = "isolated"
node_types = ["evaluator"]

[config_schema.evaluator]
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/evaluation", description = "Directory for metrics.json, confusion_matrix.png, training_curves.png, roc_curves.png (under workspace/artifacts)." }
plot_confusion_matrix = { type = "boolean", title = "Plot Confusion Matrix", default = true, description = "Save confusion_matrix.png (needs matplotlib + seaborn) (On/Off)." }
plot_training_curves = { type = "boolean", title = "Plot Training Curves", default = true, description = "Save training_curves.png from the trainer history (On/Off)." }
compute_roc = {  type = "boolean", title = "Compute ROC", default = true, description = "Compute macro ROC AUC (one-vs-rest for multi-class, positive class for binary) and save roc_curves.png (On/Off)."  }
compute_fairness = { type = "boolean", title = "Compute Fairness", default = false, description = "Per-group test accuracy sliced by fairness_attribute_key from dataset_builder test_metadata; warns when a group deviates > 10% (On/Off)." }
fairness_attribute_key = { type = "string", title = "Fairness attribute key", default = "speaker_id", description = "Per-sample metadata key used to slice fairness metrics (e.g. speaker_id, gender). Samples without the key are ignored.", ui = { visible_if = { compute_fairness = true } } }
