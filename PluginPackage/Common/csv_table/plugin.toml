[plugin]
name             = "csv-table"
version          = "1.0.0"
description      = "Read or write CSV files as list[dict]."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["csv", "table", "workflow", "common"]

dependencies = []

runtime = "inprocess"
node_types = ["csv_table"]

[config_schema.csv_table]
operation = { type = "string", title = "Operation", default = "read", description = "Operation to perform. One of: read, write.", enum = ["read", "write"] }
path = { type = "string", title = "Path", default = "", description = "Path under workspace/datasets/input (or another workspace path)." }
encoding = { type = "string", title = "Encoding", default = "utf-8", description = "Encoding." }
