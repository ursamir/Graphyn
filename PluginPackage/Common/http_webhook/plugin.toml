[plugin]
name             = "http-webhook"
version          = "1.0.0"
description      = "POST JSON to a completion callback URL. Optional HMAC signature and timeout."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["http", "webhook", "callback", "common"]

dependencies = []

optional_dependencies = [
    "httpx>=0.27",
]

runtime = "inprocess"
node_types = ["http_webhook"]

[config_schema.http_webhook]
url = { type = "string", title = "Callback URL", default = "", description = "HTTPS URL to POST completion JSON." }
timeout_s = { type = "number", title = "Timeout (s)", default = 10.0, description = "HTTP timeout in seconds." }
hmac_secret = { type = "string", title = "HMAC secret", default = "", description = "Prefer a Secrets store name via hmac_env when possible.", widget = "secret" }
hmac_env = { type = "string", title = "HMAC env / secret name", default = "", description = "Env var or Graphyn secret name holding the HMAC key." }
hmac_header = { type = "string", title = "HMAC header", default = "X-Graphyn-Signature", description = "Header that carries the signature." }
provider = { type = "string", title = "Provider", default = "http", description = "HTTP provider. Only http (real network) is supported.", enum = ["http"] }
