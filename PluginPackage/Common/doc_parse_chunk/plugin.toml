[plugin]
name             = "doc-parse-chunk"
version          = "1.0.0"
description      = "Ingest text/md/html/plain files and split into structure-aware chunks. No vector DB."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["document", "chunk", "ingest", "common"]

dependencies = []

optional_dependencies = [
    "unstructured>=0.14",
]

runtime = "inprocess"
node_types = ["doc_parse_chunk"]

[config_schema.doc_parse_chunk]
path = { type = "string", title = "Path", default = "", description = "Dataset path under workspace/ (relative path preferred)." }
recursive = { type = "boolean", title = "Recursive", default = true, description = "Walk subdirectories when scanning the filesystem (On/Off)." }
max_chars = { type = "integer", title = "Max chars", default = 1200, description = "Maximum characters per chunk when splitting documents." }
use_unstructured = { type = "boolean", title = "Use Unstructured", default = false, description = "Enable use unstructured." }
