[plugin]
name             = "dataset-balancer"
version          = "1.0.0"
description      = "Balance dataset class distributions: oversample, undersample, weighted sampling, or synthetic flagging."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "dataset", "balancing", "oversampling", "undersampling"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["dataset_balancer"]

[config_schema.dataset_balancer]
strategy = { type = "string", title = "Strategy", default = "oversample", description = "Resampling / balancing strategy. One of: oversample, undersample, weighted, synthetic.", enum = ["oversample", "undersample", "weighted", "synthetic"] }
target_count = { type = "integer", title = "Target count", default = 0, description = "Desired count per class after balancing (0 = majority for oversample/synthetic, minority for undersample)." }
balance_by = { type = "string", title = "Balance By", default = "class", description = "Grouping key for balancing: class (label).", enum = ["class"] }
jitter_std = { type = "number", title = "Jitter std", default = 0.0, description = "Gaussian jitter std-dev applied during oversampling." }
random_seed = { type = "integer", title = "Random seed", default = 42, description = "RNG seed for reproducible splits and sampling." }
