[plugin]
name             = "wait-delay"
version          = "1.0.0"
description      = "Sleep for N seconds with a configurable cap (default 300s)."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["wait", "delay", "workflow", "common"]

dependencies = []

runtime = "inprocess"
node_types = ["wait_delay"]

[config_schema.wait_delay]
seconds = { type = "number", title = "Seconds", default = 0.0, description = "Seconds." }
max_seconds = { type = "number", title = "Max Seconds", default = 300.0, description = "Max Seconds." }
