[plugin]
name             = "embedding-generator"
version          = "1.0.0"
description      = "Generate semantic audio embeddings: wav2vec2, HuBERT, CLAP, YAMNet, x-vector speaker embeddings, OpenL3."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = [
    "audio",
    "embeddings",
    "wav2vec2",
    "hubert",
    "clap",
    "xvector",
    "ssl",
    "features"
]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
]

optional_dependencies = [
    "transformers>=4.30",
    "torch>=2.0",
    "tensorflow>=2.12",
    "tensorflow-hub>=0.14",
    "speechbrain>=0.5",
    "openl3>=0.4",
]

[config_schema.embedding_generator]
model = {  type = "string", title = "Model", default = "wav2vec2", description = "Provider model id (e.g. gpt-4o-mini, whisper-1). Empty = provider default. One of: wav2vec2, hubert, clap, yamnet, xvector, openl3.", enum = ["wav2vec2", "hubert", "clap", "yamnet", "xvector", "openl3"]  }
model_name_or_path = { type = "string", title = "Model name or path", default = "", description = "HF model id or local path under workspace/artifacts." }
backend = {  type = "string", title = "Backend", default = "auto", description = "Implementation backend. One of: pytorch, tensorflow, auto.", enum = ["pytorch", "tensorflow", "auto"]  }
pooling = { type = "string", title = "Pooling", default = "mean", description = "Pooling. One of: mean, cls, last, none.", enum = ["mean", "cls", "last", "none"] }
normalize = { type = "boolean", title = "Normalize", default = true, description = "Normalize feature or audio amplitude (On/Off)." }
layer = { type = "integer", title = "Layer", default = -1, description = "Hidden layer index to pool embeddings from (-1 = last)." }
