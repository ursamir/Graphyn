[plugin]
name             = "edge-optimizer"
version          = "1.2.0"
description      = "Optimize models for edge deployment via TFLite or ONNX quantization."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "edge", "tflite", "onnx", "quantization", "common"]

dependencies = [
    "numpy>=1.24",
]

# Isolated venv extras (tflite/onnx backends; not installed into the host API image).
optional_dependencies = [
    "tensorflow>=2.13",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "tf2onnx>=1.15",
]

runtime = "isolated"
node_types = ["edge_optimizer"]

[config_schema.edge_optimizer]
backend = { type = "string", title = "Backend", default = "tflite", description = "Export format. tflite = TensorFlow Lite (supports quantization); onnx = ONNX (float32 only); tflm = TensorFlow Lite for Microcontrollers (the .tflite plus C source arrays and an op-resolver list); auto = tflite when available, else onnx.", enum = ["tflite", "onnx", "tflm", "auto"], ui = { help_advanced = "onnx uses tf2onnx (Keras) or torch.onnx (PyTorch)." } }
quantization = {  type = "string", title = "Quantization", default = "int8", description = "float32 = no quantization; float16 = half-precision weights; int8 = full integer model (uint8 input/output), calibrated on training samples. TFLite only.", enum = ["float32", "float16", "int8"], ui = { help_advanced = "int8 calibrates on rows of saved_model/X_train_repr.npy written by the trainer.", visible_if = { backend = ["tflite", "auto"] } } }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/optimized", description = "Folder for the exported model and its labels.txt.", ui = { group = "Advanced", help_advanced = "Relative to the Graphyn workspace (workspace/artifacts/...)." } }
representative_samples = { type = "integer", title = "Representative samples", default = 100, minimum = 1, description = "Number of training samples used to calibrate int8 quantization.", ui = { help_advanced = "Evenly spaced over saved_model/X_train_repr.npy.", visible_if = { quantization = "int8" } } }
prune = { type = "boolean", title = "Prune", default = false, description = "Not implemented yet: On only logs a warning; the model is exported unpruned." }
operator_fusion = { type = "boolean", title = "Weight optimization", default = true, description = "float32 only: On stores weights as int8 for a smaller file (activations stay float); Off keeps a pure float32 model.", ui = { help_advanced = "On = tf.lite.Optimize.DEFAULT (dynamic-range quantization). float16/int8 always enable it; TFLite fuses operators regardless.", visible_if = { quantization = "float32" } } }
