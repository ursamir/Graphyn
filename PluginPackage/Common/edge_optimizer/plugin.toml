[plugin]
name             = "edge-optimizer"
version          = "1.0.0"
description      = "Optimize models for edge deployment via TFLite or ONNX quantization."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "edge", "tflite", "onnx", "quantization", "common"]

dependencies = [
    "numpy>=1.24",
]

# Isolated venv extras (tflite/onnx backends; not installed into the host API image).
optional_dependencies = [
    "tensorflow>=2.13",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "tf2onnx>=1.15",
]

runtime = "isolated"
node_types = ["edge_optimizer"]

[config_schema.edge_optimizer]
backend = { type = "string", default = "tflite" }
quantization = { type = "string", default = "int8" }
output_path = { type = "string", default = "workspace/artifacts/optimized" }
representative_samples = { type = "integer", default = 100 }
prune = { type = "boolean", default = false }
operator_fusion = { type = "boolean", default = true }
