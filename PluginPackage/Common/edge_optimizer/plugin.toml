[plugin]
name             = "edge-optimizer"
version          = "1.0.0"
description      = "Optimize models for edge deployment via TFLite or ONNX quantization."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "edge", "tflite", "onnx", "quantization", "common"]

dependencies = [
    "numpy>=1.24",
]

# Isolated venv extras (tflite/onnx backends; not installed into the host API image).
optional_dependencies = [
    "tensorflow>=2.13",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "tf2onnx>=1.15",
]

runtime = "isolated"
node_types = ["edge_optimizer"]

[config_schema.edge_optimizer]
backend = { type = "string", title = "Backend", default = "tflite", description = "Implementation backend. One of: tflite, onnx, auto.", enum = ["tflite", "onnx", "auto"] }
quantization = { type = "string", title = "Quantization", default = "int8", description = "Weight/activation quantization mode. One of: float32, float16, int8.", enum = ["float32", "float16", "int8"] }
output_path = { type = "string", title = "Output Path", default = "workspace/artifacts/optimized", description = "Write under workspace/artifacts (relative to the Graphyn workspace)." }
representative_samples = { type = "integer", title = "Representative Samples", default = 100, description = "Representative Samples." }
prune = { type = "boolean", title = "Prune", default = false, description = "Enable prune." }
operator_fusion = { type = "boolean", title = "Operator Fusion", default = true, description = "Enable operator fusion." }
