[plugin]
name             = "dataset-versioner"
version          = "1.0.0"
description      = "Assign a SHA256 version hash to a dataset. Writes manifest CSV and lineage JSON for reproducibility and lineage tracking."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "dataset", "versioning", "lineage", "governance"]

dependencies = [
    "numpy>=1.24",
]

[config_schema.dataset_versioner]
output_dir = { type = "string", title = "Output dir", default = "workspace/datasets/versioned", description = "Directory under workspace/artifacts for written files." }
version_tag = { type = "string", title = "Version tag", default = "", description = "Dataset/export version label (e.g. v1, 2026-09-08)." }
include_metadata = { type = "boolean", title = "Include metadata", default = true, description = "Bundle model metadata / labels JSON with the package (On/Off)." }
create_snapshot = { type = "boolean", title = "Create Snapshot", default = false, description = "Enable create snapshot." }
