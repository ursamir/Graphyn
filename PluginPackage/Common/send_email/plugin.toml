[plugin]
name             = "send-email"
version          = "0.1.0"
description      = "Outbound SMTP email via GRAPHYN_SMTP_* env. Supports dry-run. Not IMAP/inbox."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["email", "smtp", "notify", "common"]

dependencies = []

optional_dependencies = []

runtime = "inprocess"
node_types = ["send_email"]
credential_kinds = ["smtp"]

[config_schema.send_email]
to = { type = "string", title = "To", default = "", description = "Recipient email(s), comma-separated. Falls back to input.to only when allow_payload_recipients=true." }
allowed_recipient_domains = { type = "array", title = "Allowed recipient domains", default = [], description = "If non-empty, every recipient must be in one of these domains (subdomains allowed)." }
allow_payload_recipients = { type = "boolean", title = "Allow payload recipients", default = false, description = "Use to/from from the input payload when config `to` is empty. Default false: upstream data (e.g. LLM output) cannot choose recipients." }
subject = { type = "string", title = "Subject", default = "Graphyn notification", description = "Email subject." }
body_template = { type = "string", title = "Body template", default = "", description = "Optional body override; else input body/text/content." }
from_addr = { type = "string", title = "From", default = "", description = "Override the sender address. Default: the SMTP connection's sender, then the server default sender." }
dry_run = { type = "boolean", title = "Dry run", default = false, description = "Preview only: build the message but do not connect to the mail server. The server can also force preview mode for every send." }
connection_id = { type = "string", title = "Credential connection id", default = "", description = "SMTP connection id from Graphyn credential store." }
