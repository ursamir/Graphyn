[plugin]
name             = "multimodal-fusion"
version          = "1.0.0"
description      = "Fuse audio embeddings with text, video, or sensor modalities. Strategies: concat, attention, late fusion, cross-attention."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = [
    "multimodal",
    "fusion",
    "embeddings",
    "audio",
    "text",
    "video",
    "clap",
    "generative"
]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "torch>=2.0",
]

[config_schema.multimodal_fusion]
fusion_type = { type = "string", title = "Fusion Type", default = "concat", description = "Fusion Type. One of: concat, attention, late, cross_attention.", enum = ["concat", "attention", "late", "cross_attention"] }
audio_dim = { type = "integer", title = "Audio Dim", default = 768, description = "Audio Dim." }
text_dim = { type = "integer", title = "Text Dim", default = 768, description = "Text Dim." }
output_dim = { type = "integer", title = "Output Dim", default = 512, description = "Output Dim." }
backend = { type = "string", title = "Backend", default = "numpy", description = "Implementation backend. One of: numpy, pytorch.", enum = ["numpy", "pytorch"] }
normalize = { type = "boolean", title = "Normalize", default = true, description = "Normalize feature or audio amplitude." }
