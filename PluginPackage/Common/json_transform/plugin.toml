[plugin]
name             = "json-transform"
version          = "1.0.0"
description      = "Stdlib JSONPath/dotted-path extract and remap. No exec."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["json", "transform", "workflow", "common"]

dependencies = []

runtime = "inprocess"
node_types = ["json_transform"]

[config_schema.json_transform]
mappings = { type = "array", title = "Mappings", default = [], description = "Mappings." }
pick = { type = "array", title = "Pick", default = [], description = "Pick." }
path = { type = "string", title = "Path", default = "", description = "Path under workspace/datasets/input (or another workspace path)." }
