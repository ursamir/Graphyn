[plugin]
name             = "json-transform"
version          = "1.0.0"
description      = "Stdlib JSONPath/dotted-path extract and remap. No exec."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["json", "transform", "workflow", "common"]

dependencies = []

runtime = "inprocess"
node_types = ["json_transform"]

[config_schema.json_transform]
mappings = { type = "array", title = "Mappings", default = [], description = "List of {from, to} JSONPath/dotted remaps.", widget = "json" }
pick = { type = "array", title = "Pick", default = [], description = "Optional list of paths to keep (whitelist)." }
path = { type = "string", title = "Root path", default = "", description = "Optional dotted path into the payload before mapping." }
