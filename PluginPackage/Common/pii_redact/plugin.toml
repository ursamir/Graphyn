[plugin]
name             = "pii-redact"
version          = "1.0.0"
description      = "Redact PII from transcripts (Presidio if present, else regex). Optionally silence matching audio spans."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["pii", "privacy", "redaction", "common"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]

runtime = "inprocess"
node_types = ["pii_redact"]

[config_schema.pii_redact]
placeholder = { type = "string", title = "Placeholder", default = "", description = "Replacement text inserted for redacted PII spans." }
engine = {  type = "string", title = "Engine", default = "auto", description = "auto picks Presidio when installed, else regex. One of: auto, regex, presidio.", enum = ["auto", "regex", "presidio"]  }