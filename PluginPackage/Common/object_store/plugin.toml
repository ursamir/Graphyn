[plugin]
name             = "object-store"
version          = "1.0.0"
description      = "Get/put/list objects. Local filesystem backend by default; optional S3 via boto3."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["storage", "s3", "export", "common"]

dependencies = []

optional_dependencies = [
    "boto3>=1.34",
]

runtime = "inprocess"
node_types = ["object_store"]

[config_schema.object_store]
backend = { type = "string", title = "Backend", default = "local", description = "Implementation backend. One of: local, s3.", enum = ["local", "s3"] }
operation = { type = "string", title = "Operation", default = "put", description = "Operation to perform. One of: get, put, list.", enum = ["get", "put", "list"] }
root = { type = "string", title = "Root", default = "workspace/artifacts/object_store", description = "Write under workspace/artifacts (relative to the Graphyn workspace)." }
key = { type = "string", title = "Key", default = "", description = "Key." }
prefix = { type = "string", title = "Prefix", default = "", description = "Prefix." }
bucket = { type = "string", title = "Bucket", default = "", description = "Bucket." }
dest = { type = "string", title = "Dest", default = "", description = "Write under workspace/artifacts (relative to the Graphyn workspace)." }
