[plugin]
name             = "merge"
version          = "1.0.0"
description      = "Append lists or combine dicts/lists by key."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["merge", "workflow", "common"]

dependencies = []

runtime = "inprocess"
node_types = ["merge"]

[config_schema.merge]
mode = { type = "string", title = "Mode", default = "append", description = "Operating mode. One of: append, combine_by_key.", enum = ["append", "combine_by_key"] }
key = { type = "string", title = "Key", default = "id", description = "Key." }
