[plugin]
name             = "asr-transcribe"
version          = "1.0.0"
description      = "Adapter node: transcribe audio via OpenAI-compatible (default), AssemblyAI (poll), Deepgram, or mock."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["asr", "speech", "transcript", "common"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "httpx>=0.27",
]

runtime = "inprocess"
node_types = ["asr_transcribe"]
