[plugin]
name             = "dataset-builder"
version          = "1.1.0"
description      = "Assemble FeatureArray objects into ML-ready train/val/test datasets."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["ml", "dataset", "training", "common"]

dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

optional_dependencies = [
    "tensorflow>=2.13",
    "torch>=2.0",
]

runtime = "isolated"
node_types = ["dataset_builder"]

[config_schema.dataset_builder]
split_ratios = {  type = "object", title = "Split ratios", default = { train = 0.7, val = 0.15, test = 0.15 }, description = "Auto-split only (used when not every sample carries a train/val/test split in metadata or in its path): train/val/test fractions, each in [0, 1], summing to 1.0.", widget = "json" }
shuffle = { type = "boolean", title = "Shuffle", default = true, description = "Auto-split only: shuffle before splitting (stratify requires shuffle On)." }
stratify = { type = "boolean", title = "Stratify", default = true, description = "Auto-split only: stratify train/val/test by label (falls back to unstratified when a class is too small)." }
output_format = { type = "string", title = "Output Format", default = "numpy", description = "numpy = plain arrays (works everywhere); tensorflow / pytorch also attach ready-made framework datasets (in-process runs only).", enum = ["numpy", "tensorflow", "pytorch"], ui = { group = "Advanced", help_advanced = "tf.data / TensorDataset objects live in DatasetArtifact.metadata and cannot cross the isolated-worker boundary." } }
fixed_length = { type = "integer", title = "Fixed length", default = 0, minimum = 0, description = "Pad (zeros) / truncate the time axis to this many frames (0 = pad every split to the longest clip)." }
random_seed = { type = "integer", title = "Random seed", default = 42, description = "RNG seed for reproducible auto-splits." }
