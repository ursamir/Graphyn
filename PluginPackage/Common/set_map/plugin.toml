[plugin]
name             = "set-map"
version          = "1.0.0"
description      = "Copy, rename, and drop fields on dict/list payloads."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["transform", "map", "workflow", "common"]

dependencies = []

runtime = "inprocess"
node_types = ["set_map"]

[config_schema.set_map]
copy_fields = {  type = "object", title = "Copy fields", default = { }, description = "Map of source → destination field names to copy.", widget = "json"  }
rename = {  type = "object", title = "Rename", default = { }, description = "Map of old_name → new_name for payload keys.", widget = "json"  }
drop = { type = "array", title = "Drop", default = [], description = "Field names to remove from the payload." }
set = {  type = "object", title = "Set", default = { }, description = "Constant fields to inject into the payload (JSON object).", widget = "json"  }