[plugin]
name             = "deployment-packager"
version          = "1.0.0"
description      = "Bundle optimized models into deployment-ready packages: mobile ZIP, MCU C header, Docker image, or edge TAR."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "deployment", "packaging", "tflite", "docker", "edge", "mcu"]

dependencies = [
    "numpy>=1.24",
]

[config_schema.deployment_packager]
target = {  type = "string", title = "Target", default = "mobile", description = "Deployment target package format. One of: mobile, mcu, docker, edge.", enum = ["mobile", "mcu", "docker", "edge"]  }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/packages", description = "Write under workspace/artifacts (relative to the Graphyn workspace)." }
include_inference_script = { type = "boolean", title = "Include inference script", default = true, description = "Bundle a minimal inference script with the package (On/Off)." }
include_metadata = { type = "boolean", title = "Include metadata", default = true, description = "Bundle model metadata / labels JSON with the package (On/Off)." }
package_name = { type = "string", title = "Package name", default = "", description = "Name of the deployment package artifact (empty = derive from model)." }
