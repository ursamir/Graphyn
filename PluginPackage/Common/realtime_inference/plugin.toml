[plugin]
name             = "realtime-inference"
version          = "1.1.0"
description      = "Low-latency inference for TFLite, PyTorch, and ONNX models. Supports classification, wake word, streaming ASR, and adaptive frame-skipping."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "inference", "tflite", "pytorch", "onnx", "realtime", "common"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "tensorflow>=2.13",
    "torch>=2.0",
    "onnxruntime>=1.16",
]

runtime = "isolated"
node_types = ["realtime_inference"]

[config_schema.realtime_inference]
model_path = { type = "string", title = "Model Path", description = "Model file under workspace/artifacts, or empty for a built-in model." }
backend = { type = "string", title = "Backend", default = "auto", description = "Implementation backend. One of: tflite, pytorch, onnx, auto.", enum = ["tflite", "pytorch", "onnx", "auto"] }
mode = { type = "string", title = "Mode", default = "classification", description = "Operating mode. One of: classification, wake_word, streaming_asr.", enum = ["classification", "wake_word", "streaming_asr"] }
wake_word_threshold = { type = "number", title = "Wake Word Threshold", default = 0.8, description = "Wake Word Threshold." }
batch_size = { type = "integer", title = "Batch Size", default = 1, description = "Mini-batch size." }
adaptive = { type = "boolean", title = "Adaptive", default = false, description = "Enable adaptive." }
adaptive_skip_ratio = { type = "number", title = "Adaptive Skip Ratio", default = 0.5, description = "Adaptive Skip Ratio." }
streaming_buffer_size = { type = "integer", title = "Streaming Buffer Size", default = 10, description = "Streaming Buffer Size." }
