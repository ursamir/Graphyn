[plugin]
name             = "realtime-inference"
version          = "1.1.0"
description      = "Low-latency inference for TFLite, PyTorch, and ONNX models. Supports classification, wake word, streaming ASR, and adaptive frame-skipping."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "inference", "tflite", "pytorch", "onnx", "realtime", "common"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "tensorflow>=2.13",
    "torch>=2.0",
    "onnxruntime>=1.16",
]

runtime = "isolated"
node_types = ["realtime_inference"]

[config_schema.realtime_inference]
model_path = { type = "string" }
backend = { type = "string", default = "auto" }
mode = { type = "string", default = "classification" }
wake_word_threshold = { type = "number", default = 0.8 }
batch_size = { type = "integer", default = 1 }
adaptive = { type = "boolean", default = false }
adaptive_skip_ratio = { type = "number", default = 0.5 }
streaming_buffer_size = { type = "integer", default = 10 }
