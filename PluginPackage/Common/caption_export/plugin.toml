[plugin]
name             = "caption-export"
version          = "1.0.0"
description      = "Export a word-timed / diarized transcript to SRT, VTT, or JSON files on disk."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["captions", "srt", "vtt", "export", "common"]

dependencies = []

runtime = "inprocess"
node_types = ["caption_export"]

[config_schema.caption_export]
output_dir = { type = "string", title = "Output dir", default = "workspace/artifacts/captions", description = "Directory under workspace/artifacts for written files." }
basename = { type = "string", title = "Basename", default = "captions", description = "Output filename stem (without extension)." }
formats = { type = "array", title = "Formats", default = ["srt", "vtt", "json"], description = "Formats to write: choose among srt, vtt, json." }
max_words_per_cue = { type = "integer", title = "Max words per cue", default = 12, description = "Soft wrap captions after this many words per cue." }
