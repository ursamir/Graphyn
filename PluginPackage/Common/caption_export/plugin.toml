[plugin]
name             = "caption-export"
version          = "1.0.0"
description      = "Export a word-timed / diarized transcript to SRT, VTT, or JSON files on disk."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["captions", "srt", "vtt", "export", "common"]

dependencies = []

runtime = "inprocess"
node_types = ["caption_export"]

[config_schema.caption_export]
output_dir = { type = "string", title = "Output Dir", default = "workspace/artifacts/captions", description = "Write under workspace/artifacts (relative to the Graphyn workspace)." }
basename = { type = "string", title = "Basename", default = "captions", description = "Filename stem for exported caption files." }
formats = { type = "array", title = "Formats", default = ["srt", "vtt", "json"], description = "Export formats: srt, vtt, and/or json." }
max_words_per_cue = { type = "integer", title = "Max words per cue", default = 12, description = "Wrap captions when a cue exceeds this word count." }
