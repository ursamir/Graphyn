[plugin]
name             = "structured-llm"
version          = "1.0.0"
description      = "Extract JSON matching a schema from text via OpenAI-compatible chat completions (requires OPENAI_API_KEY)."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["llm", "json", "extract", "common"]

dependencies = []

optional_dependencies = [
    "httpx>=0.27",
]

runtime = "inprocess"
node_types = ["structured_llm"]

[config_schema.structured_llm]
provider = { type = "string", title = "Provider", default = "openai_compat", description = "LLM provider backend. Only openai_compat is supported (requires OPENAI_API_KEY).", enum = ["openai_compat"] }
json_schema = {  type = "object", title = "JSON Schema", default = { }, description = "JSON Schema object the model must satisfy.", widget = "json"  }
schema_name = { type = "string", title = "Schema name", default = "extracted", description = "Name attached to the structured-output schema for the provider." }
model = { type = "string", title = "Model", default = "gpt-4o-mini", description = "Chat model id (default gpt-4o-mini). Requires OPENAI_API_KEY." }
base_url = { type = "string", title = "Base URL", default = "", description = "OpenAI-compatible base URL override." }
timeout_s = { type = "number", title = "Timeout (s)", default = 30.0, description = "Request/operation timeout in seconds." }
system_prompt = { type = "string", title = "System prompt", default = "Extract JSON matching the provided schema. Reply with JSON only.", description = "System instruction for extraction; keep output JSON-only." }
