[plugin]
name             = "structured-llm"
version          = "1.3.0"
description      = "Extract JSON matching a schema from text with a real LLM (auto-selected configured provider), or an explicit non-LLM rule-based extractor."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["llm", "json", "extract", "common"]

dependencies = []

optional_dependencies = [
    "httpx>=0.27",
]

runtime = "inprocess"
node_types = ["structured_llm"]
credential_kinds = ["openai_compat", "ollama", "anthropic", "gemini"]

[config_schema.structured_llm]
provider = { type = "string", title = "Provider", default = "auto", description = "auto (default): the configured LLM (connection / workspace default, local Ollama via OLLAMA_BASE_URL, or an API key); fails clearly if none. openai_compat | ollama | anthropic | gemini: that provider. rule_based: deterministic keyword rules, NOT an LLM — unmatched fields are left empty and listed as unfilled in the result.", enum = ["auto", "openai_compat", "ollama", "anthropic", "gemini", "rule_based"], ui = { group = "Basic" } }
json_schema = { type = "object", title = "JSON Schema", default = { }, description = "JSON Schema object the model must satisfy.", widget = "json", ui = { group = "Basic" } }
schema_name = { type = "string", title = "Schema name", default = "extracted", description = "Name attached to the structured-output schema for the provider.", ui = { group = "Basic" } }
model = { type = "string", title = "Model", default = "gpt-4o-mini", description = "Chat model id. Ollama uses OLLAMA_MODEL / the connection default when left as gpt-*.", ui = { group = "Basic" } }
base_url = { type = "string", title = "Base URL", default = "", description = "OpenAI-compatible base URL override. Groq: https://api.groq.com/openai/v1", ui = { group = "Advanced" } }
timeout_s = { type = "number", title = "Timeout (s)", default = 30.0, description = "Request/operation timeout in seconds.", ui = { group = "Advanced" } }
system_prompt = { type = "string", title = "System prompt", default = "Extract JSON matching the provided schema. Reply with JSON only.", description = "System instruction for extraction; keep output JSON-only.", ui = { group = "Basic" } }
connection_id = { type = "string", title = "Credential connection id", default = "", description = "Platform credential connection id." }
