[plugin]
name             = "trainer"
version          = "1.0.0"
description      = "Unified model training orchestration for Keras and PyTorch."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "training", "keras", "pytorch", "common"]

dependencies = [
    "numpy>=1.24",
]

# Isolated venv extras (never installed into the host API image).
# tensorflow (CPU wheels) + keras are installed on isolated load.
# torch is skipped unless GRAPHYN_ISOLATED_INSTALL_TORCH=1.
optional_dependencies = [
    "tensorflow>=2.13",
    "keras>=3.0",
    "torch>=2.0",
]

runtime = "isolated"
node_types = ["trainer", "model_builder"]

[config_schema.trainer]
backend = {  type = "string", title = "Backend", default = "auto", description = "Implementation backend. One of: keras, pytorch, auto.", enum = ["keras", "pytorch", "auto"]  }
device = {  type = "string", title = "Device", default = "auto", description = "Compute device (auto uses GPU when available and allowed). One of: auto, cpu, gpu.", enum = ["auto", "cpu", "gpu"]  }
epochs = { type = "integer", title = "Epochs", default = 30, description = "Maximum training epochs (early stopping may halt sooner)." }
batch_size = { type = "integer", title = "Batch size", default = 32, description = "Process in batches of N (0 = all at once)." }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/models", description = "Write under workspace/artifacts (relative to the Graphyn workspace)." }
patience = { type = "integer", title = "Patience", default = 5, description = "EarlyStopping patience (monitors validation metric)." }
mixed_precision = { type = "boolean", title = "Mixed precision", default = false, description = "Enable mixed-precision training when the backend supports it (On/Off)." }
min_val_accuracy = { type = "number", title = "Min val accuracy", default = 0.0, description = "Warn if best validation accuracy is below this threshold (0 disables)." }
checkpoint_path = { type = "string", title = "Checkpoint path", default = "", description = "Optional checkpoint directory under workspace/artifacts." }

[config_schema.model_builder]
architecture = { type = "string", title = "Architecture", default = "ds_cnn", description = "Model architecture. One of: ds_cnn, mobilenet, simple_cnn.", enum = ["ds_cnn", "mobilenet", "simple_cnn"] }
filters = { type = "integer", title = "Filters", default = 64, description = "Base convolution filter count." }
num_layers = { type = "integer", title = "Num Layers", default = 4, description = "Number of blocks/layers in the architecture." }
dropout_rate = { type = "number", title = "Dropout Rate", default = 0.25, description = "Dropout probability before the classifier head." }
learning_rate = { type = "number", title = "Learning Rate", default = 0.001, description = "Optimizer learning rate." }
backend = {  type = "string", title = "Backend", default = "auto", description = "Implementation backend. One of: keras, auto.", enum = ["keras", "auto"]  }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/models", description = "Write under workspace/artifacts (relative to the Graphyn workspace)." }
