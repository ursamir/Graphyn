[plugin]
name             = "trainer"
version          = "1.0.0"
description      = "Unified model training orchestration for Keras and PyTorch."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "training", "keras", "pytorch", "common"]

dependencies = [
    "numpy>=1.24",
]

# Isolated venv extras (never installed into the host API image).
# tensorflow (CPU wheels) + keras are installed on isolated load.
# torch is skipped unless GRAPHYN_ISOLATED_INSTALL_TORCH=1.
optional_dependencies = [
    "tensorflow>=2.13",
    "keras>=3.0",
    "torch>=2.0",
]

runtime = "isolated"
node_types = ["trainer", "model_builder"]

[config_schema.trainer]
backend = { type = "string", title = "Backend", default = "auto", description = "keras = TensorFlow/Keras (use with Model builder); pytorch = PyTorch (Model builder only produces Keras models); auto = Keras when available, else PyTorch.", enum = ["keras", "pytorch", "auto"], ui = { help_advanced = "pytorch needs an in-process nn.Module on the model port.", group = "Basic" } }
device = { type = "string", title = "Device", default = "auto", description = "auto = use a GPU when one is available, else CPU; cpu = always CPU; gpu = prefer GPU (falls back to CPU with a warning).", enum = ["auto", "cpu", "gpu"], ui = { help_advanced = "auto honours the host settings GRAPHYN_TF_DEVICE, CUDA_VISIBLE_DEVICES and GRAPHYN_ML_FORCE_CPU. GPU memory growth is enabled so other GPU apps keep running.", group = "Basic" } }
epochs = { type = "integer", title = "Epochs", default = 30, minimum = 1, description = "Maximum training epochs (early stopping may halt sooner).", ui = { group = "Basic" } }
batch_size = { type = "integer", title = "Batch size", default = 32, minimum = 1, description = "Mini-batch size for training and validation.", ui = { group = "Basic" } }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/models", description = "Folder for the trained model (model.keras, saved_model/, labels.txt) and checkpoints.", ui = { group = "Advanced", help_advanced = "Relative to the Graphyn workspace; each run is scoped to runs/<run_id>/." } }
patience = { type = "integer", title = "Patience", default = 5, minimum = 0, description = "Stop after this many epochs without a validation-accuracy improvement (the first few warm-up epochs do not count).", ui = { help_advanced = "Keras EarlyStopping on val_accuracy; warm-up = min(5, epochs / 10) epochs.", group = "Basic" } }
mixed_precision = { type = "boolean", title = "Mixed precision", default = false, description = "Train with 16-bit floats where safe; mostly faster on GPU (On/Off).", ui = { help_advanced = "Keras mixed_float16 policy (restored afterwards); PyTorch CUDA autocast.", group = "Advanced" } }
min_val_accuracy = { type = "number", title = "Min val accuracy", default = 0.0, minimum = 0, maximum = 1, description = "Log a warning if best validation accuracy is below this threshold (0 disables). Does not fail the run.", ui = { group = "Advanced" } }
checkpoint_path = { type = "string", title = "Checkpoint path", default = "", description = "Where to keep the best checkpoint. Empty = checkpoints/best.keras in the output folder.", ui = { group = "Advanced" } }
learning_rate = { type = "number", title = "Learning rate", exclusiveMinimum = 0, description = "Learning rate for training. Empty = keep the Model builder's learning rate.", ui = { help_advanced = "Adam optimizer.", group = "Advanced" } }
reduce_lr_factor = { type = "number", title = "Reduce LR factor", default = 0.5, exclusiveMinimum = 0, exclusiveMaximum = 1, description = "Multiply the learning rate by this factor when validation loss stops improving.", ui = { help_advanced = "Keras ReduceLROnPlateau.", group = "Advanced" } }
reduce_lr_patience = { type = "integer", title = "Reduce LR patience", default = 3, minimum = 0, description = "Epochs without validation-loss improvement before the learning rate is reduced.", ui = { help_advanced = "Keras only.", group = "Advanced" } }
shuffle = { type = "boolean", title = "Shuffle", default = true, description = "Shuffle training batches each epoch (On/Off).", ui = { group = "Advanced" } }
early_stopping_min_delta = { type = "number", title = "Early stopping min delta", default = 0.0, minimum = 0, description = "Minimum val_accuracy increase that counts as an improvement.", ui = { group = "Advanced" } }

[config_schema.model_builder]
architecture = { type = "string", title = "Architecture", default = "ds_cnn", description = "ds_cnn = DS-CNN keyword-spotting network (Hello Edge, 2017); mobilenet = MobileNetV2 (2018); simple_cnn = small two-layer CNN baseline; custom = your own layer list (use Load from preset to start).", enum = ["ds_cnn", "mobilenet", "simple_cnn", "custom"], ui = { group = "Basic" } }
filters = { type = "integer", title = "Filters", default = 64, minimum = 1, description = "Base convolution filter / width count (presets).", ui = { group = "Basic", visible_if = { architecture = ["ds_cnn", "mobilenet", "simple_cnn"] } } }
num_layers = { type = "integer", title = "Num Layers", default = 4, minimum = 0, description = "Number of DS blocks (ds_cnn) or inverted-residual blocks (mobilenet). Ignored by simple_cnn.", ui = { group = "Basic", visible_if = { architecture = ["ds_cnn", "mobilenet"] } } }
expansion_factor = { type = "integer", title = "Expansion factor", default = 6, minimum = 1, description = "MobileNetV2 inverted-residual expansion (paper default 6).", ui = { group = "Advanced", visible_if = { architecture = "mobilenet" } } }
stem_stride = { type = "integer", title = "Stem stride", default = 2, minimum = 1, description = "MobileNetV2 stem Conv2D stride (paper default 2).", ui = { group = "Advanced", visible_if = { architecture = "mobilenet" } } }
layers = { type = "array", title = "Layers", default = [], description = "Custom architecture body as a list of {type, ...} ops. Types: conv2d, depthwise_conv2d, batch_norm, relu, relu6, max_pool2d, avg_pool2d, global_avg_pool2d, dropout, dense, inverted_residual, ds_separable_block. Required when architecture=custom. Use Load from preset to seed.", widget = "json", ui = { group = "Basic", visible_if = { architecture = "custom" } } }
dropout_rate = { type = "number", title = "Dropout Rate", default = 0.25, minimum = 0, exclusiveMaximum = 1, description = "Dropout probability before the classifier head.", ui = { group = "Basic" } }
learning_rate = { type = "number", title = "Learning Rate", default = 0.001, exclusiveMinimum = 0, description = "Adam learning rate compiled into the model (used by trainer unless trainer.learning_rate is set).", ui = { group = "Basic" } }
backend = {  type = "string", title = "Backend", default = "auto", description = "Implementation backend: keras, or auto (requires TensorFlow).", enum = ["keras", "auto"], ui = { group = "Advanced" }  }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/models", description = "Folder for the untrained model that is handed to the Trainer.", ui = { group = "Advanced", help_advanced = "Files are named compiled_<uuid>.keras; the run view shows the architecture name instead." } }
