[plugin]
name             = "trainer"
version          = "1.0.0"
description      = "Unified model training orchestration for Keras and PyTorch."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["ml", "training", "keras", "pytorch", "common"]

dependencies = [
    "numpy>=1.24",
]

# Isolated venv extras (never installed into the host API image).
# tensorflow (CPU wheels) + keras are installed on isolated load.
# torch is skipped unless GRAPHYN_ISOLATED_INSTALL_TORCH=1.
optional_dependencies = [
    "tensorflow>=2.13",
    "keras>=3.0",
    "torch>=2.0",
]

runtime = "isolated"
node_types = ["trainer", "model_builder"]

[config_schema.trainer]
backend = { type = "string", title = "Backend", default = "auto", description = "keras = TensorFlow/Keras (works with model_builder); pytorch = needs an in-process nn.Module on the model port (model_builder only emits Keras); auto = keras when TensorFlow is importable, else pytorch.", enum = ["keras", "pytorch", "auto"], ui = { group = "Basic" } }
device = { type = "string", title = "Device", default = "auto", description = "auto = GPU when available and allowed (GRAPHYN_TF_DEVICE / CUDA_VISIBLE_DEVICES / GRAPHYN_ML_FORCE_CPU), else CPU; cpu = force CPU; gpu = prefer GPU (falls back to CPU with a warning when none is usable).", enum = ["auto", "cpu", "gpu"], ui = { group = "Basic" } }
epochs = { type = "integer", title = "Epochs", default = 30, minimum = 1, description = "Maximum training epochs (early stopping may halt sooner).", ui = { group = "Basic" } }
batch_size = { type = "integer", title = "Batch size", default = 32, minimum = 1, description = "Mini-batch size for training and validation.", ui = { group = "Basic" } }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/models", description = "Directory for model.keras, saved_model/ and checkpoints/ (under workspace/artifacts; runs are scoped to runs/<run_id>/).", ui = { group = "Basic" } }
patience = { type = "integer", title = "Patience", default = 5, minimum = 0, description = "EarlyStopping patience in epochs on val_accuracy (warm-up of min(5, epochs/10) epochs is ignored).", ui = { group = "Advanced" } }
mixed_precision = { type = "boolean", title = "Mixed precision", default = false, description = "Keras: mixed_float16 policy (restored afterwards); PyTorch: CUDA autocast. Mostly useful on GPU (On/Off).", ui = { group = "Advanced" } }
min_val_accuracy = { type = "number", title = "Min val accuracy", default = 0.0, minimum = 0, maximum = 1, description = "Log a warning if best validation accuracy is below this threshold (0 disables). Does not fail the run.", ui = { group = "Advanced" } }
checkpoint_path = { type = "string", title = "Checkpoint path", default = "", description = "Best-val_accuracy checkpoint file (.keras); empty = <output_path>/checkpoints/best.keras.", ui = { group = "Advanced" } }
learning_rate = { type = "number", title = "Learning rate", exclusiveMinimum = 0, description = "Adam learning rate for training. Empty/null = keep the model's compiled learning rate (model_builder.learning_rate).", ui = { group = "Advanced" } }
reduce_lr_factor = { type = "number", title = "Reduce LR factor", default = 0.5, exclusiveMinimum = 0, exclusiveMaximum = 1, description = "Multiply learning rate by this factor on val_loss plateau (Keras ReduceLROnPlateau).", ui = { group = "Advanced" } }
reduce_lr_patience = { type = "integer", title = "Reduce LR patience", default = 3, minimum = 0, description = "Epochs with no val_loss improvement before reducing LR (Keras).", ui = { group = "Advanced" } }
shuffle = { type = "boolean", title = "Shuffle", default = true, description = "Shuffle training batches each epoch (On/Off).", ui = { group = "Advanced" } }
early_stopping_min_delta = { type = "number", title = "Early stopping min delta", default = 0.0, minimum = 0, description = "Minimum val_accuracy increase that counts as an improvement.", ui = { group = "Advanced" } }

[config_schema.model_builder]
architecture = { type = "string", title = "Architecture", default = "ds_cnn", description = "ds_cnn = Conv2D + num_layers depthwise-separable blocks; mobilenet = num_layers inverted-residual blocks (expansion 6); simple_cnn = fixed 2 conv + pool layers (ignores num_layers).", enum = ["ds_cnn", "mobilenet", "simple_cnn"] }
filters = { type = "integer", title = "Filters", default = 64, minimum = 1, description = "Base convolution filter count." }
num_layers = { type = "integer", title = "Num Layers", default = 4, minimum = 0, description = "Number of DS blocks (ds_cnn) or inverted-residual blocks (mobilenet). Ignored by simple_cnn.", ui = { visible_if = { architecture = ["ds_cnn", "mobilenet"] } } }
dropout_rate = { type = "number", title = "Dropout Rate", default = 0.25, minimum = 0, exclusiveMaximum = 1, description = "Dropout probability before the classifier head." }
learning_rate = { type = "number", title = "Learning Rate", default = 0.001, exclusiveMinimum = 0, description = "Adam learning rate compiled into the model (used by trainer unless trainer.learning_rate is set)." }
backend = {  type = "string", title = "Backend", default = "auto", description = "Implementation backend. One of: keras, auto (auto requires TensorFlow).", enum = ["keras", "auto"]  }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/models", description = "Directory for the compiled_<uuid>.keras hand-off file (under workspace/artifacts)." }
