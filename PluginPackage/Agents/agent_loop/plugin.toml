[plugin]
name             = "agent-loop"
version          = "0.1.0"
description      = "Extractive agent loop (no LLM, no tool calls); output mode=extractive"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["agents", "agent"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["agent_loop"]

[config_schema.agent_loop]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
max_steps = { type = "integer", title = "Max steps", default = 8, description = "Maximum context windows to scan." }
model = { type = "string", title = "Model", default = "gpt-4o-mini", description = "Reserved — ignored (extractive mode calls no model)." }
api_secret_name = { type = "string", title = "Api secret name", default = "OPENAI_API_KEY", description = "Reserved — ignored (extractive mode calls no model)." }
tool_allowlist = { type = "array", title = "Tool allowlist", default = [], description = "Reserved — ignored (extractive mode calls no tools)." }
