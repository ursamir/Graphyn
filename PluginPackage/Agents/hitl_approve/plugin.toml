[plugin]
name             = "hitl-approve"
version          = "0.2.0"
description      = "Human-in-the-loop approval gate: out-of-band decision file, fail-closed on timeout"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["agents", "hitl"]

dependencies = []

runtime = "inprocess"
node_types = ["hitl_approve"]

[config_schema.hitl_approve]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
timeout_s = { type = "number", title = "Timeout s", default = 3600.0, description = "Seconds to wait for a decision before rejecting (0 = check once)." }
poll_interval_s = { type = "number", title = "Poll interval s", default = 2.0, description = "Decision file poll interval." }
approver_roles = { type = "array", title = "Approver roles", default = [], description = "Allowed decision roles (empty = any named approver)." }
reason_required = { type = "boolean", title = "Reason required", default = true, description = "Reject decisions that carry no reason." }
gate_id = { type = "string", title = "Gate id", default = "hitl_approve", description = "Decision key within the run (use the graph node id)." }
decision_dir = { type = "string", title = "Decision dir", default = "workspace/artifacts/agents/hitl_approve/decisions", description = "Directory for request/decision files." }
unattended_approve = { type = "boolean", title = "Unattended approve", default = false, description = "DANGEROUS: pass the gate with no human present (records a receipt). Default false." }
