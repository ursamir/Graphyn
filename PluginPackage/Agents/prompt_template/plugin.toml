[plugin]
name             = "prompt-template"
version          = "0.1.0"
description      = "Jinja/f-string prompt render"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["agents", "prompt", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["prompt_template"]

[config_schema.prompt_template]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
template = { type = "string", title = "Template", default = "", description = "Template." }
engine = { type = "string", title = "Engine", default = "fstring", description = "Engine." }
