[plugin]
name             = "llm-chat"
version          = "0.1.0"
description      = "Multi-turn chat completion"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["agents", "llm", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["llm_chat"]

[config_schema.llm_chat]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
model = { type = "string", title = "Model", default = "gpt-4o-mini", description = "Model." }
temperature = { type = "number", title = "Temperature", default = 0.2, description = "Temperature." }
api_secret_name = { type = "string", title = "Api secret name", default = "OPENAI_API_KEY", description = "Api secret name." }
