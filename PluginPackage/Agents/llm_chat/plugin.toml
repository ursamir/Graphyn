[plugin]
name             = "llm-chat"
version          = "0.4.0"
description      = "Multi-turn chat with a real model: auto-selected configured provider (Ollama, OpenAI-compatible, Anthropic, Gemini); explicit echo provider for tests."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["agents", "llm", "openai", "ollama", "anthropic", "gemini"]

dependencies = []

optional_dependencies = [
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["llm_chat"]
credential_kinds = ["openai_compat", "anthropic", "gemini", "ollama"]

[config_schema.llm_chat]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Deprecated: same as provider=echo. Returns a labelled placeholder, never a model answer." }
provider = { type = "string", title = "Provider", default = "auto", description = "auto (default): the configured LLM — connection / workspace default, local Ollama (OLLAMA_BASE_URL), or an API key; fails clearly if none is set. openai_compat | ollama | anthropic | gemini: that provider. echo: returns your input unchanged (for tests; not an LLM).", enum = ["auto", "openai_compat", "ollama", "anthropic", "gemini", "echo"] }
model = { type = "string", title = "Model", default = "gpt-4o-mini", description = "Chat model id. Ollama uses OLLAMA_MODEL / the connection default when left as gpt-*." }
temperature = { type = "number", title = "Temperature", default = 0.2, description = "Sampling temperature." }
api_secret_name = { type = "string", title = "API secret name", default = "OPENAI_API_KEY", description = "Secret/env for openai_compat. Unused for echo/ollama." }
base_url = { type = "string", title = "Base URL", default = "", description = "OpenAI-compatible base URL override (must pass the egress policy)." }
system_prompt = { type = "string", title = "System prompt", default = "", description = "Optional system message." }
timeout_s = { type = "number", title = "Timeout (s)", default = 60.0, description = "HTTP timeout seconds." }
connection_id = { type = "string", title = "Credential connection id", default = "", description = "Platform credential connection id for this provider. Empty → workspace default → env." }
