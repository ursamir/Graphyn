[plugin]
name             = "llm-chat"
version          = "0.3.0"
description      = "Multi-turn chat via stub, OpenAI-compatible, Ollama, Anthropic, or Gemini."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["agents", "llm", "openai", "ollama", "anthropic", "gemini"]

dependencies = []

optional_dependencies = [
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["llm_chat"]

[config_schema.llm_chat]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true, return deterministic stub output (no network)." }
provider = { type = "string", title = "Provider", default = "stub", description = "stub | openai_compat | ollama | anthropic | gemini", enum = ["stub", "openai_compat", "ollama", "anthropic", "gemini"] }
model = { type = "string", title = "Model", default = "gpt-4o-mini", description = "Chat model id. For ollama, defaults to llama3.2 when left as gpt-*." }
temperature = { type = "number", title = "Temperature", default = 0.2, description = "Sampling temperature." }
api_secret_name = { type = "string", title = "API secret name", default = "OPENAI_API_KEY", description = "Secret/env for openai_compat. Unused for stub/ollama." }
base_url = { type = "string", title = "Base URL", default = "", description = "OpenAI-compatible base URL. Ollama: http://127.0.0.1:11434/v1" }
system_prompt = { type = "string", title = "System prompt", default = "", description = "Optional system message." }
timeout_s = { type = "number", title = "Timeout (s)", default = 60.0, description = "HTTP timeout seconds." }
