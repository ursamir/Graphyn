[plugin]
name             = "guardrail-filter"
version          = "0.1.0"
description      = "PII/jailbreak/toxicity guardrails"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["agents", "guardrail"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["guardrail_filter"]

[config_schema.guardrail_filter]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
policies = { type = "array", title = "Policies", default = ["pii", "secret"], description = "Rules to apply: pii, secret, profanity, jailbreak. Empty → pii+secret." }
action = { type = "string", title = "Action", default = "block", enum = ["block", "redact", "flag"], description = "block (raise), redact (mask matches, keep structure) or flag (pass through + violations)." }
