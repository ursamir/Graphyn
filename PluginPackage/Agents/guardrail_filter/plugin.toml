[plugin]
name             = "guardrail-filter"
version          = "0.1.0"
description      = "PII/jailbreak/toxicity guardrails"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["agents", "guardrail", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["guardrail_filter"]

[config_schema.guardrail_filter]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
policies = { type = "array", title = "Policies", default = [], description = "Policies." }
action = { type = "string", title = "Action", default = "block", description = "Action." }
