[plugin]
name             = "stream-ingest"
version          = "1.0.0"
description      = "Real-time streaming audio ingestion from microphone, WebSocket, and file streams."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "streaming", "realtime", "input"]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
]

optional_dependencies = [
    "sounddevice>=0.4",
    "websockets>=11.0",
]

[config_schema.stream_ingest]
source = {  type = "string", title = "Source", default = "microphone", description = "Python source for trusted operators. Not a sandbox. One of: microphone, websocket, file_stream.", enum = ["microphone", "websocket", "file_stream"]  }
device_id = { type = "integer", title = "Device ID", default = 0, description = "sounddevice input device index (default device when unset)." }
websocket_url = { type = "string", title = "WebSocket URL", default = "", description = "ws:// or wss:// URL when source is a websocket stream." }
file_path = { type = "string", title = "File Path", default = "", description = "Path under workspace/datasets/input (or another workspace path)." }
chunk_ms = { type = "integer", title = "Chunk (ms)", default = 100, description = "Capture/emit chunk duration in milliseconds." }
sample_rate = { type = "integer", title = "Sample rate", default = 16000, description = "Audio sample rate in Hz." }
channels = { type = "integer", title = "Channels", default = 1, description = "Number of input audio channels (1 = mono)." }
buffer_size = { type = "integer", title = "Buffer size", default = 10, description = "Internal ring-buffer size in frames/chunks." }
duration_s = { type = "number", title = "Duration (s)", default = 5.0, description = "Capture or synthesize this many seconds (0 = until stopped/EOS)." }
label = { type = "string", title = "Label", default = "", description = "Optional label attached to emitted samples." }
