[plugin]
name             = "audio-quality-gate"
version          = "1.0.0"
description      = "Dataset quality validation: SNR, clipping, silence, loudness, bandwidth, duration."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "quality", "validation", "preprocessing"]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "scipy>=1.10",
]

optional_dependencies = [
    "pyloudnorm>=0.1",
]

[config_schema.audio_quality_gate]
min_snr_db = { type = "number", title = "Min SNR (dB)", default = 10.0, description = "Reject audio whose estimated SNR is below this (dB)." }
max_clipping_ratio = { type = "number", title = "Max clipping ratio", default = 0.01, description = "Reject if fraction of clipped samples exceeds this (0–1)." }
min_duration_s = { type = "number", title = "Min duration (s)", default = 0.1, description = "Reject clips shorter than this many seconds." }
max_duration_s = { type = "number", title = "Max duration (s)", default = 60.0, description = "Reject clips longer than this many seconds (0 = no max)." }
min_lufs = { type = "number", title = "Min LUFS", default = -70.0, description = "Reject if integrated loudness is below this LUFS." }
max_lufs = { type = "number", title = "Max LUFS", default = -10.0, description = "Reject if integrated loudness is above this LUFS." }
min_bandwidth_hz = { type = "number", title = "Min bandwidth (Hz)", default = 1000.0, description = "Reject if estimated bandwidth is below this (Hz)." }
rejection_policy = { type = "string", title = "Rejection Policy", default = "skip", description = "What to do when a sample fails quality checks. One of: skip, warn, raise.", enum = ["skip", "warn", "raise"] }
check_snr = {  type = "boolean", title = "Check SNR", default = true, description = "Enable SNR quality check against min_snr_db (On/Off)."  }
check_clipping = { type = "boolean", title = "Check Clipping", default = true, description = "Enable check clipping." }
check_silence = { type = "boolean", title = "Check Silence", default = true, description = "Enable check silence." }
silence_rms_threshold = { type = "number", title = "Silence RMS threshold", default = 0.001, description = "RMS below which the clip is treated as silence and rejected." }
check_duration = { type = "boolean", title = "Check Duration", default = true, description = "Enable check duration." }
check_lufs = {  type = "boolean", title = "Check LUFS", default = false, description = "Enable integrated-loudness check against min/max LUFS (On/Off)."  }
check_bandwidth = { type = "boolean", title = "Check Bandwidth", default = true, description = "Enable check bandwidth." }
