[plugin]
name             = "audio-quality-gate"
version          = "1.0.0"
description      = "Dataset quality validation: SNR, clipping, silence, loudness, bandwidth, duration."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "quality", "validation", "preprocessing"]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "scipy>=1.10",
]

optional_dependencies = [
    "pyloudnorm>=0.1",
]

[config_schema.audio_quality_gate]
min_snr_db = { type = "number", title = "Min SNR DB", default = 10.0, description = "Min SNR DB." }
max_clipping_ratio = { type = "number", title = "Max Clipping Ratio", default = 0.01, description = "Max Clipping Ratio." }
min_duration_s = { type = "number", title = "Min Duration S", default = 0.1, description = "Min Duration S." }
max_duration_s = { type = "number", title = "Max Duration S", default = 60.0, description = "Max Duration S." }
min_lufs = { type = "number", title = "Min LUFS", default = -70.0, description = "Min LUFS." }
max_lufs = { type = "number", title = "Max LUFS", default = -10.0, description = "Max LUFS." }
min_bandwidth_hz = { type = "number", title = "Min Bandwidth HZ", default = 1000.0, description = "Min Bandwidth HZ." }
rejection_policy = { type = "string", title = "Rejection Policy", default = "skip", description = "What to do when a sample fails quality checks. One of: skip, warn, raise.", enum = ["skip", "warn", "raise"] }
check_snr = { type = "boolean", title = "Check SNR", default = true, description = "Enable check snr." }
check_clipping = { type = "boolean", title = "Check Clipping", default = true, description = "Enable check clipping." }
check_silence = { type = "boolean", title = "Check Silence", default = true, description = "Enable check silence." }
silence_rms_threshold = { type = "number", title = "Silence RMS Threshold", default = 0.001, description = "Silence RMS Threshold." }
check_duration = { type = "boolean", title = "Check Duration", default = true, description = "Enable check duration." }
check_lufs = { type = "boolean", title = "Check LUFS", default = false, description = "Enable check lufs." }
check_bandwidth = { type = "boolean", title = "Check Bandwidth", default = true, description = "Enable check bandwidth." }
