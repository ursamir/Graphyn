[plugin]
name             = "audio-quality-gate"
version          = "1.0.0"
description      = "Dataset quality validation: SNR, clipping, silence, loudness, bandwidth, duration."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "quality", "validation", "preprocessing"]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "scipy>=1.10",
]

optional_dependencies = [
    "pyloudnorm>=0.1",
]

node_types = ["audio_quality_gate"]
runtime    = "inprocess"  # explicit (was the implicit default)

[config_schema.audio_quality_gate]
min_snr_db = { type = "number", title = "Min SNR (dB)", default = 10.0, description = "Reject audio whose estimated signal-to-noise ratio is below this (dB). Clips with a near-silent noise floor are not checked.", ui = { help_advanced = "SNR = mean power vs the 5th-percentile amplitude floor.", group = "Basic", visible_if = { check_snr = true } } }
max_clipping_ratio = { type = "number", title = "Max clipping ratio", default = 0.01, minimum = 0, maximum = 1, description = "Reject if the fraction of samples with |x| >= 0.99 exceeds this (0–1).", ui = { group = "Basic", visible_if = { check_clipping = true } } }
min_duration_s = { type = "number", title = "Min duration (s)", default = 0.1, minimum = 0, description = "Reject clips shorter than this many seconds.", ui = { group = "Basic", visible_if = { check_duration = true } } }
max_duration_s = { type = "number", title = "Max duration (s)", default = 60.0, minimum = 0, description = "Reject clips longer than this many seconds (0 = no max).", ui = { group = "Basic", visible_if = { check_duration = true } } }
min_lufs = { type = "number", title = "Min LUFS", default = -70.0, maximum = 0, description = "Reject if integrated loudness is below this LUFS (clips shorter than 0.4 s are not checked).", ui = { help_advanced = "Needs the optional pyloudnorm package.", group = "Basic", visible_if = { check_lufs = true } } }
max_lufs = { type = "number", title = "Max LUFS", default = -10.0, maximum = 0, description = "Reject if integrated loudness is above this LUFS.", ui = { group = "Basic", visible_if = { check_lufs = true } } }
min_bandwidth_hz = { type = "number", title = "Min bandwidth (Hz)", default = 1000.0, minimum = 0, description = "Reject if the mean 85% spectral rolloff is below this (Hz).", ui = { group = "Basic", visible_if = { check_bandwidth = true } } }
rejection_policy = { type = "string", title = "Rejection Policy", default = "skip", description = "What to do when a sample fails: skip = route to the 'rejected' port silently; warn = same plus a warning log; raise = fail the run.", enum = ["skip", "warn", "raise"], ui = { group = "Basic" } }
check_snr = {  type = "boolean", title = "Check SNR", default = true, description = "Enable SNR quality check against min_snr_db (On/Off).", ui = { group = "Advanced" } }
check_clipping = { type = "boolean", title = "Check Clipping", default = true, description = "Enable the clipping-ratio check against max_clipping_ratio (On/Off).", ui = { group = "Advanced" } }
check_silence = { type = "boolean", title = "Check Silence", default = true, description = "Enable the silence check against silence_rms_threshold (On/Off).", ui = { group = "Advanced" } }
silence_rms_threshold = { type = "number", title = "Silence RMS threshold", default = 0.001, minimum = 0, maximum = 1, description = "Linear RMS below which the clip is treated as silence and rejected.", ui = { group = "Advanced", visible_if = { check_silence = true } } }
check_duration = { type = "boolean", title = "Check Duration", default = true, description = "Enable the duration check against min/max_duration_s (On/Off).", ui = { group = "Advanced" } }
check_lufs = {  type = "boolean", title = "Check LUFS", default = false, description = "Enable integrated-loudness check against min/max LUFS (On/Off).", ui = { group = "Advanced" } }
check_bandwidth = { type = "boolean", title = "Check Bandwidth", default = true, description = "Enable the spectral-bandwidth check against min_bandwidth_hz (On/Off).", ui = { group = "Advanced" } }
