[plugin]
name             = "feature-frontend"
version          = "1.1.0"
description      = "Unified audio feature extraction frontend: log-mel, MFCC+delta, ZCR, spectral features, chroma, raw waveform passthrough."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = [
    "audio",
    "features",
    "ml",
    "frontend",
    "spectrogram",
    "mfcc",
    "delta",
    "zcr",
    "ssl",
    "embeddings"
]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
]

[config_schema.feature_frontend]
feature_type = { type = "string", title = "Feature Type", default = "log_mel", description = "Audio feature representation to extract. One of: log_mel, mfcc, spectrogram, chroma, zcr, spectral_centroid, spectral_rolloff, raw.", enum = ["log_mel", "mfcc", "spectrogram", "chroma", "zcr", "spectral_centroid", "spectral_rolloff", "raw"] }
sample_rate = { type = "integer", title = "Sample Rate", default = 16000, description = "Audio sample rate in Hz." }
fixed_length = { type = "integer", title = "Fixed Length", default = 0, description = "Fixed Length." }
n_fft = { type = "integer", title = "N Fft", default = 512, description = "N Fft." }
hop_length = { type = "integer", title = "Hop Length", default = 160, description = "Hop Length." }
win_length = { type = "integer", title = "Win Length", default = 400, description = "Win Length." }
n_mels = { type = "integer", title = "N Mels", default = 80, description = "N Mels." }
n_mfcc = { type = "integer", title = "N Mfcc", default = 13, description = "N Mfcc." }
fmin = { type = "number", title = "Fmin", default = 0.0, description = "Fmin." }
fmax = { type = "number", title = "Fmax", description = "Fmax." }
log_scale = { type = "boolean", title = "Log Scale", default = true, description = "Enable log scale." }
normalize = { type = "boolean", title = "Normalize", default = true, description = "Normalize feature or audio amplitude." }
center = { type = "boolean", title = "Center", default = true, description = "Enable center." }
delta = { type = "boolean", title = "Delta", default = false, description = "Enable delta." }
delta_delta = { type = "boolean", title = "Delta Delta", default = false, description = "Enable delta delta." }
