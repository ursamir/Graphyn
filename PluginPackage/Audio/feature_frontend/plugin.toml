[plugin]
name             = "feature-frontend"
version          = "1.1.0"
description      = "Unified audio feature extraction frontend: log-mel, MFCC+delta, ZCR, spectral features, chroma, raw waveform passthrough."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = [
    "audio",
    "features",
    "ml",
    "frontend",
    "spectrogram",
    "mfcc",
    "delta",
    "zcr",
    "ssl",
    "embeddings"
]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
]

[config_schema.feature_frontend]
feature_type = {  type = "string", title = "Feature type", default = "log_mel", description = "Audio feature representation to extract. One of: log_mel, mfcc, spectrogram, chroma, zcr, spectral_centroid, spectral_rolloff, raw.", enum = ["log_mel", "mfcc", "spectrogram", "chroma", "zcr", "spectral_centroid", "spectral_rolloff", "raw"]  }
sample_rate = { type = "integer", title = "Sample rate", default = 16000, description = "Audio sample rate in Hz." }
fixed_length = { type = "integer", title = "Fixed length (frames)", default = 0, description = "Pad/truncate the time axis to exactly N frames (0 = variable length)." }
n_fft = { type = "integer", title = "FFT size", default = 512, description = "FFT window size in samples (power of two recommended)." }
hop_length = { type = "integer", title = "Hop length", default = 160, description = "Hop between STFT frames in samples." }
win_length = { type = "integer", title = "Window length", default = 400, description = "Analysis window length in samples (≤ n_fft)." }
n_mels = { type = "integer", title = "Mel bins", default = 80, description = "Number of mel filterbank bins." }
n_mfcc = { type = "integer", title = "MFCC coeffs", default = 13, description = "Number of MFCC coefficients to keep." }
fmin = { type = "number", title = "Min frequency (Hz)", default = 0.0, description = "Lowest frequency included in the mel/spectrogram filterbank." }
fmax = { type = "number", title = "Max frequency (Hz)", description = "Highest frequency included (null = Nyquist / sample_rate/2)." }
log_scale = { type = "boolean", title = "Log scale", default = true, description = "Apply log compression to spectrogram/mel energies (On/Off)." }
normalize = { type = "boolean", title = "Normalize", default = true, description = "Normalize feature or audio amplitude (On/Off)." }
center = { type = "boolean", title = "Center frames", default = true, description = "Pad so frames are centered on the signal (librosa center=True)." }
delta = { type = "boolean", title = "Delta features", default = false, description = "Append first-order delta (velocity) coefficients (On/Off)." }
delta_delta = { type = "boolean", title = "Delta-delta features", default = false, description = "Append second-order delta (acceleration) coefficients (On/Off)." }
