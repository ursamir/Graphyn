[plugin]
name             = "stream-processor"
version          = "1.0.0"
description      = "Rolling window buffering for streaming audio: configurable window/hop, overlap-add reconstruction, latency monitoring, buffer health."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "streaming", "realtime", "windowing", "buffer"]

dependencies = [
    "numpy>=1.24",
]

[config_schema.stream_processor]
window_ms = { type = "integer", title = "Window MS", default = 1000, description = "Window MS." }
hop_ms = { type = "integer", title = "Hop MS", default = 500, description = "Hop MS." }
target_latency_ms = { type = "integer", title = "Target Latency MS", default = 200, description = "Target Latency MS." }
max_buffer_size = { type = "integer", title = "Max Buffer Size", default = 100, description = "Max Buffer Size." }
sample_rate = { type = "integer", title = "Sample Rate", default = 16000, description = "Audio sample rate in Hz." }
overlap_add = { type = "boolean", title = "Overlap Add", default = false, description = "Enable overlap add." }
