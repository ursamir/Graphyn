[plugin]
name             = "audio-exporter"
version          = "1.0.0"
description      = "Export AudioSample objects to WAV files organised by split (train/val/test) and label."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "output", "export", "dataset"]

dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[config_schema.audio_exporter]
output_dir = { type = "string", title = "Output dir", default = "workspace/artifacts/audio_export", description = "Directory under workspace/artifacts for written files." }
format = { type = "string", title = "Format", default = "wav", description = "Output audio format. Currently wav only (soundfile PCM). One of: wav.", enum = ["wav"] }
split_ratios = {  type = "object", title = "Split ratios", default = { }, description = "Train/val/test ratios as JSON; should sum to ~1.0.", widget = "json", train = 0.7, val = 0.15, test = 0.15  }
version_tag = { type = "string", title = "Version tag", default = "v1", description = "Dataset/export version label (e.g. v1, 2026-09-08)." }
random_seed = { type = "integer", title = "Random seed", default = 42, description = "RNG seed for reproducible splits and sampling." }
append = { type = "boolean", title = "Append", default = false, description = "Append files into an existing export tree instead of replacing it (On/Off)." }
