[plugin]
name             = "audio-exporter"
version          = "1.1.0"
description      = "Export AudioSample objects to WAV files organised by split (train/val/test) and label."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "output", "export", "dataset"]

dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

node_types = ["audio_exporter"]

[config_schema.audio_exporter]
output_dir = { type = "string", title = "Output dir", default = "workspace/datasets/output/audio_export", description = "Export root (must resolve inside the working directory); files go to {output_dir}/{version_tag}/{split}/{label}/. Ignored when project is set." }
project = { type = "string", title = "Project", default = "", description = "Optional project name; when set, output_dir becomes workspace/datasets/output/{project}." }
format = { type = "string", title = "Format", default = "wav", description = "Output audio format. Currently wav only (soundfile, 16-bit PCM). One of: wav.", enum = ["wav"] }
split_ratios = { type = "object", title = "Split ratios", default = { train = 0.7, val = 0.15, test = 0.15 }, description = "Split name → weight (each >= 0, at least one > 0). Weights are normalised when they do not sum to 1. Samples with metadata.split matching a key keep that split.", widget = "json" }
group_by_source = { type = "boolean", title = "Group splits by source", default = true, description = "Assign one split per source recording (metadata.parent or path) so segments/augmented copies of a clip never leak across train/val/test (On/Off). Off = independent random split per sample." }
version_tag = { type = "string", title = "Version tag", default = "v1", pattern = "^v[0-9]+(\\.[0-9]+)*$", description = "Canonical version tag matching vN / vN.N.N (e.g. v1, v1.0.0)." }
random_seed = { type = "integer", title = "Random seed", default = 42, description = "RNG seed for reproducible split assignment." }
append = { type = "boolean", title = "Append", default = false, description = "On = add files and merge labels.csv/metadata.json into an existing {output_dir}/{version_tag}; Off = delete that version dir first." }
