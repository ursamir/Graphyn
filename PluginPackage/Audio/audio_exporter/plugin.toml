[plugin]
name             = "audio-exporter"
version          = "1.2.0"
description      = "Export AudioSample objects to WAV files organised by split (train/val/test) and label, as immutable dataset versions with a sha256 manifest."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "output", "export", "dataset"]

dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

node_types = ["audio_exporter"]

[config_schema.audio_exporter]
output_dir = { type = "string", title = "Output dir", default = "workspace/datasets/output/audio_export", description = "Folder for the exported dataset; files go to <folder>/<version>/<split>/<label>/. Ignored when Project is set.", ui = { group = "Advanced", help_advanced = "Must resolve inside the working directory (default workspace/datasets/output/audio_export)." } }
project = { type = "string", title = "Project", default = "", description = "Optional project name; when set, the dataset is saved in that project's Library folder.", ui = { help_advanced = "Output folder becomes workspace/datasets/output/<project>." } }
format = { type = "string", title = "Format", default = "wav", description = "Output audio format (16-bit PCM WAV).", enum = ["wav"], ui = { help_advanced = "Written with soundfile." } }
split_ratios = { type = "object", title = "Split ratios", default = { train = 0.7, val = 0.15, test = 0.15 }, description = "Train / val / test weights (each 0 or more, at least one above 0); normalised when they do not add up to 1.", widget = "json", ui = { help_advanced = "Samples whose metadata.split matches a key keep that split." } }
group_by_source = { type = "boolean", title = "Group splits by source", default = true, description = "Keep every segment and augmented copy of a recording in the same split, so test clips never leak into training (On/Off). Off = random split per sample.", ui = { help_advanced = "Grouping key: metadata.parent, else the source path." } }
version_tag = { type = "string", title = "Version tag", default = "v1", pattern = "^v[0-9]+(\\.[0-9]+)*$", description = "Canonical version tag matching vN / vN.N.N (e.g. v1, v1.0.0)." }
random_seed = { type = "integer", title = "Random seed", default = 42, description = "RNG seed for reproducible split assignment." }
append = { type = "boolean", title = "Append", default = false, description = "On = add to an existing dataset version (its file lists are merged); Off = write a new version (next free vN when the tag is taken).", ui = { help_advanced = "Merges labels.csv / metadata.json in <output_dir>/<version_tag> and recomputes manifest.json; refused when runs or packages reference that version." } }
overwrite = { type = "boolean", title = "Overwrite existing version", default = false, description = "On = replace an existing version with the same tag (refused when runs or packages reference it); Off = never replace — an existing tag makes the export go to the next free version.", ui = { group = "Advanced", help_advanced = "Dataset versions are immutable by default: v1 taken → v2, v1.0.0 taken → v1.0.1 (logged)." } }
