[plugin]
name             = "segmenter"
version          = "1.1.0"
description      = "Semantic audio segmentation: fixed windows, silence-based, VAD, energy-event detection, and speaker-turn placeholder."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "segmentation", "vad", "preprocessing", "event"]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
]

optional_dependencies = [
    "webrtcvad>=2.0",
]

[config_schema.segmenter]
mode = {  type = "string", title = "Mode", default = "fixed", description = "Operating mode. One of: fixed, silence, vad, event, speaker_turn.", enum = ["fixed", "silence", "vad", "event", "speaker_turn"]  }
window_ms = { type = "integer", title = "Window (ms)", default = 1000, description = "Segment/window length in milliseconds." }
overlap = { type = "number", title = "Overlap", default = 0.0, description = "Fractional overlap between consecutive windows in [0, 1)." }
vad_aggressiveness = { type = "integer", title = "VAD aggressiveness", default = 2, description = "WebRTC VAD aggressiveness 0–3 (higher = more aggressive speech filtering)." }
silence_threshold_db = { type = "number", title = "Silence threshold (dB)", default = 40.0, description = "Silence detection threshold in dB (higher = more audio treated as silence)." }
event_threshold_db = { type = "number", title = "Event threshold (dB)", default = -30.0, description = "Energy threshold in dB for event-mode onset detection." }
event_min_gap_ms = { type = "integer", title = "Event min gap (ms)", default = 200, description = "Minimum gap between events before they are split (milliseconds)." }
min_segment_ms = { type = "integer", title = "Min segment (ms)", default = 100, description = "Discard or merge segments shorter than this (milliseconds)." }
max_segment_ms = { type = "integer", title = "Max segment (ms)", default = 30000, description = "Hard cap on segment length (milliseconds); longer spans are split." }
