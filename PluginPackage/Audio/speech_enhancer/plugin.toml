[plugin]
name             = "speech-enhancer"
version          = "1.0.0"
description      = "Speech cleanup: denoising (spectral subtraction or DeepFilterNet), dereverberation, vocal isolation, and telephony bandpass."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = [
    "audio",
    "enhancement",
    "denoising",
    "speech",
    "deepfilter",
    "preprocessing"
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "noisereduce>=3.0,<4",
]

optional_dependencies = [
    "deepfilternet>=0.5",
    "torch>=2.0",
]

[config_schema.speech_enhancer]
backend = {  type = "string", title = "Backend", default = "spectral", description = "Implementation backend. One of: spectral, deepfilter, auto.", enum = ["spectral", "deepfilter", "auto"]  }
denoise = {  type = "boolean", title = "Denoise", default = true, description = "Apply noise reduction / spectral gating (On/Off)."  }
dereverb = {  type = "boolean", title = "Dereverb", default = false, description = "Apply dereverberation when the backend supports it (On/Off)."  }
vocal_isolation = { type = "boolean", title = "Vocal Isolation", default = false, description = "Enable vocal isolation." }
telephony_mode = { type = "boolean", title = "Telephony Mode", default = false, description = "Enable telephony mode." }
stationary_noise = { type = "boolean", title = "Stationary Noise", default = true, description = "Enable stationary noise." }
prop_decrease = { type = "number", title = "Prop decrease", default = 0.75, description = "Noise reduction strength for spectral gating (0–1)." }
