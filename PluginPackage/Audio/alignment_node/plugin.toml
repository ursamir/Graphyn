[plugin]
name             = "alignment-node"
version          = "2.0.0"
description      = "Forced alignment of transcripts to audio (word or character timestamps) with the multilingual MMS CTC aligner (torchaudio)."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = [
    "audio",
    "alignment",
    "asr",
    "ctc",
    "timestamps",
    "transcript",
    "preprocessing"
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "torchaudio>=2.1",
    "uroman>=1.3",
]

runtime = "isolated"
node_types = ["alignment_node"]

[config_schema.alignment_node]
language = { type = "string", title = "Language", default = "en", description = "ISO 639-1 code of the transcript (used for romanisation of non-Latin text)." }
level = { type = "string", title = "Level", default = "word", description = "Timestamp granularity: word or char.", enum = ["word", "char"] }
device = { type = "string", title = "Device", default = "cpu", description = "Compute device (cuda falls back to cpu when unavailable).", enum = ["cpu", "cuda"] }
