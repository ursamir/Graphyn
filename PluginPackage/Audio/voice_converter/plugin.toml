[plugin]
name             = "voice-converter"
version          = "1.0.0"
description      = "Transform speaker identity or vocal style via SpeechBrain or kNN-VC. Supports timbre, accent, gender, and style conversion."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = [
    "audio",
    "voice-conversion",
    "speechbrain",
    "knnvc",
    "timbre",
    "generative"
]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
]

optional_dependencies = [
    "speechbrain>=0.5",
    "torch>=2.0",
    "knnvc>=0.1",
    "soundfile>=0.12",
]

[config_schema.voice_converter]
backend = { type = "string", title = "Backend", default = "auto", description = "Implementation backend. One of: speechbrain, knnvc, auto.", enum = ["speechbrain", "knnvc", "auto"] }
conversion_type = { type = "string", title = "Conversion Type", default = "timbre", description = "Conversion Type. One of: timbre, accent, gender, style.", enum = ["timbre", "accent", "gender", "style"] }
target_speaker = { type = "string", title = "Target Speaker", default = "", description = "Target Speaker." }
pitch_shift_semitones = { type = "number", title = "Pitch Shift Semitones", default = 0.0, description = "Pitch Shift Semitones." }
