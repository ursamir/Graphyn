[plugin]
name             = "environment-simulator"
version          = "1.0.0"
description      = "Simulate physical acoustic environments via room impulse response convolution. Presets: room, car, office, outdoor, custom."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = [
    "audio",
    "simulation",
    "reverb",
    "rir",
    "pyroomacoustics",
    "augmentation"
]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "pyroomacoustics>=0.7",
]

[config_schema.environment_simulator]
preset = { type = "string", title = "Preset", default = "room", description = "Preset. One of: room, car, office, outdoor, custom.", enum = ["room", "car", "office", "outdoor", "custom"] }
room_dimensions = { type = "array", title = "Room Dimensions", default = [5.0, 4.0, 3.0], description = "Room Dimensions." }
rt60 = { type = "number", title = "Rt60", default = 0.4, description = "Rt60." }
mic_position = { type = "array", title = "Mic Position", default = [2.5, 2.0, 1.5], description = "Mic Position." }
source_position = { type = "array", title = "Source Position", default = [1.0, 1.0, 1.5], description = "Source Position." }
snr_db = { type = "number", title = "SNR DB", default = 0.0, description = "SNR DB." }
copies_per_sample = { type = "integer", title = "Copies Per Sample", default = 1, description = "Copies Per Sample." }
max_rir_length_ms = { type = "number", title = "Max Rir Length MS", default = 500.0, description = "Max Rir Length MS." }
preserve_length = { type = "boolean", title = "Preserve Length", default = false, description = "Enable preserve length." }
