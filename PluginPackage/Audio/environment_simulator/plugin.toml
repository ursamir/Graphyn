[plugin]
name             = "environment-simulator"
version          = "1.0.0"
description      = "Simulate physical acoustic environments via room impulse response convolution. Presets: room, car, office, outdoor, custom."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = [
    "audio",
    "simulation",
    "reverb",
    "rir",
    "pyroomacoustics",
    "augmentation"
]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "pyroomacoustics>=0.7",
]

[config_schema.environment_simulator]
preset = { type = "string", title = "Preset", default = "room", description = "Preset. One of: room, car, office, outdoor, custom.", enum = ["room", "car", "office", "outdoor", "custom"] }
room_dimensions = { type = "array", title = "Room dimensions", default = ["5.0", "4.0", "3.0"], description = "Room size as [length, width, height] in meters.", widget = "json" }
rt60 = { type = "number", title = "RT60 (s)", default = 0.4, description = "Target reverberation time in seconds." }
mic_position = { type = "array", title = "Mic position", default = ["2.5", "2.0", "1.5"], description = "Microphone XYZ position in meters inside the room.", widget = "json" }
source_position = { type = "array", title = "Source position", default = ["1.0", "1.0", "1.5"], description = "Source XYZ position in meters inside the room.", widget = "json" }
snr_db = { type = "number", title = "SNR (dB)", default = 0.0, description = "Signal-to-noise ratio target when mixing noise/reverb." }
copies_per_sample = { type = "integer", title = "Copies per sample", default = 1, description = "How many simulated room/noise variants to emit per input." }
max_rir_length_ms = { type = "number", title = "Max RIR length (ms)", default = 500.0, description = "Truncate room impulse response to this length (ms)." }
preserve_length = { type = "boolean", title = "Preserve Length", default = false, description = "Enable preserve length." }
