[plugin]
name             = "dataset-ingest"
version          = "1.2.0"
description      = "Universal audio dataset ingestion from filesystem, archives (ZIP, TAR), HuggingFace, S3, and manifests."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "input", "dataset", "ingestion"]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
]

optional_dependencies = [
    "datasets>=2.14",
    "boto3>=1.28",
]

node_types = ["dataset_ingest"]
runtime    = "inprocess"  # explicit (was the implicit default)

[config_schema.dataset_ingest]
source_type = {  type = "string", title = "Source type", default = "filesystem", description = "Where to load the dataset from. One of: filesystem, huggingface, s3, zip, tar, manifest.", enum = ["filesystem", "huggingface", "s3", "zip", "tar", "manifest"]  }
path = { type = "string", title = "Path", default = "", description = "Folder (or archive) to load audio from, relative to the workspace.", ui = { help_advanced = "Relative paths resolve against the Graphyn workspace (workspace/...)." } }
manifest_path = { type = "string", title = "Manifest path", default = "", description = "Manifest file (JSON or CSV) listing audio files and labels. Empty = use Path.", ui = { visible_if = { source_type = "manifest" } } }
recursive = { type = "boolean", title = "Recursive", default = true, description = "Walk subdirectories when scanning the filesystem; each file is labelled by its parent directory name (On/Off). Off = only files directly in path, labelled by the folder name.", ui = { visible_if = { source_type = "filesystem" } } }
limit = { type = "integer", title = "Limit", default = 0, minimum = 0, description = "Maximum files to load (0 = no limit). filesystem + recursive: per label (directory basename, counted across split dirs, in sorted walk order); otherwise: total." }
label_override = { type = "string", title = "Label override", default = "", description = "Force every sample to this label (empty = infer from folders/manifest)." }
hf_split = { type = "string", title = "HF split", default = "train", description = "HuggingFace split name (train / validation / test).", ui = { visible_if = { source_type = "huggingface" } } }
hf_audio_column = { type = "string", title = "HF audio column", default = "audio", description = "Column containing audio in the HuggingFace dataset.", ui = { visible_if = { source_type = "huggingface" } } }
hf_label_column = { type = "string", title = "HF label column", default = "label", description = "Column containing labels in the HuggingFace dataset.", ui = { visible_if = { source_type = "huggingface" } } }
lazy = { type = "boolean", title = "Lazy load", default = false, description = "Not implemented yet: On only logs a warning; audio is always loaded up front.", ui = { group = "Advanced" } }
resume_from = { type = "string", title = "Resume from", default = "", description = "Optional checkpoint or manifest to resume an interrupted ingest from.", ui = { group = "Advanced" } }
validate_integrity = { type = "boolean", title = "Validate integrity", default = false, description = "Verify checksum files (.sha256) next to the audio when present (On/Off).", ui = { group = "Advanced" } }
deduplicate = { type = "boolean", title = "Deduplicate", default = false, description = "Skip duplicate waveforms by content hash (On/Off)." }
max_archive_files = { type = "integer", title = "Max archive files", default = 100000, minimum = 1, description = "ZIP / TAR only: refuse archives with more files than this (protects against archive bombs).", ui = { group = "Advanced", visible_if = { source_type = ["zip", "tar"] } } }
max_archive_mb = { type = "integer", title = "Max archive size (MB)", default = 20480, minimum = 1, description = "ZIP / TAR only: stop extracting once this many MB have been unpacked.", ui = { group = "Advanced", visible_if = { source_type = ["zip", "tar"] } } }
