[plugin]
name             = "dataset-ingest"
version          = "1.1.0"
description      = "Universal audio dataset ingestion from filesystem, archives (ZIP, TAR), HuggingFace, S3, and manifests."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = ["audio", "input", "dataset", "ingestion"]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
]

optional_dependencies = [
    "datasets>=2.14",
    "boto3>=1.28",
]

[config_schema.dataset_ingest]
source_type = {  type = "string", title = "Source type", default = "filesystem", description = "Where to load the dataset from. One of: filesystem, huggingface, s3, zip, tar, manifest.", enum = ["filesystem", "huggingface", "s3", "zip", "tar", "manifest"]  }
path = { type = "string", title = "Path", default = "", description = "Dataset path under workspace/ (relative path preferred)." }
manifest_path = { type = "string", title = "Manifest path", default = "", description = "Path to a manifest JSON/CSV under workspace/." }
recursive = { type = "boolean", title = "Recursive", default = true, description = "Walk subdirectories when scanning the filesystem (On/Off)." }
limit = { type = "integer", title = "Limit", default = 0, description = "Maximum items to load (0 = no limit)." }
label_override = { type = "string", title = "Label override", default = "", description = "Force every sample to this label (empty = infer from folders/manifest)." }
hf_split = { type = "string", title = "HF split", default = "train", description = "HuggingFace split name (train / validation / test)." }
hf_audio_column = { type = "string", title = "HF audio column", default = "audio", description = "Column containing audio in the HuggingFace dataset." }
hf_label_column = { type = "string", title = "HF label column", default = "label", description = "Column containing labels in the HuggingFace dataset." }
lazy = { type = "boolean", title = "Lazy load", default = false, description = "Defer waveform decode until a downstream node reads samples (On/Off)." }
resume_from = { type = "string", title = "Resume from", default = "", description = "Optional checkpoint/manifest path to resume ingestion." }
validate_integrity = { type = "boolean", title = "Validate integrity", default = false, description = "Verify .sha256 sidecars when present (On/Off)." }
deduplicate = { type = "boolean", title = "Deduplicate", default = false, description = "Skip duplicate waveforms by content hash (On/Off)." }
