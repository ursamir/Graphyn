[plugin]
name             = "audio-conditioner"
version          = "1.1.0"
description      = "Unified production-grade audio preprocessing frontend with LUFS normalization and dynamic range compression."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = [
    "audio",
    "preprocessing",
    "conditioning",
    "frontend",
    "edge-ai",
    "lufs",
    "compression"
]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "scipy>=1.10"
]

optional_dependencies = [
    "pyloudnorm>=0.1",
]

node_types = ["audio_conditioner"]

[config_schema.audio_conditioner]
target_sample_rate = { type = "integer", title = "Target sample rate", default = 16000, minimum = 1000, maximum = 384000, description = "Resample audio to this rate (Hz).", ui = { group = "Basic" } }
mono = { type = "boolean", title = "Mono", default = true, description = "Downmix to a single channel (On/Off).", ui = { group = "Basic" } }
trim_silence = { type = "boolean", title = "Trim silence", default = true, description = "Trim leading/trailing silence quieter than trim_threshold_db below the clip peak (On/Off).", ui = { group = "Basic" } }
trim_threshold_db = { type = "number", title = "Trim threshold (dB below peak)", default = 40.0, exclusiveMinimum = 0, maximum = 120, description = "Frames quieter than (clip peak minus this many dB) count as silence. Higher = less audio trimmed.", ui = { help_advanced = "Passed to librosa.effects.trim as top_db.", group = "Advanced", visible_if = { trim_silence = true } } }
normalize = { type = "boolean", title = "Normalize", default = true, description = "Normalize audio amplitude with normalize_method (On/Off).", ui = { group = "Basic" } }
normalize_method = { type = "string", title = "Normalize method", default = "peak", description = "Loudness normalization method: peak, rms or lufs (perceived loudness; uses rms at the target level when LUFS measurement is unavailable).", enum = ["peak", "rms", "lufs"], ui = { help_advanced = "lufs needs the optional pyloudnorm package.", group = "Basic", visible_if = { normalize = true } } }
target_level_db = { type = "number", title = "Target level (dBFS)", default = -1.0, minimum = -96, maximum = 0, description = "Target level in dBFS for peak or rms normalization.", ui = { help_advanced = "Also used as the rms fallback for lufs when pyloudnorm is not installed.", group = "Basic", visible_if = { normalize = true, normalize_method = ["peak", "rms"] } } }
target_lufs = { type = "number", title = "Target LUFS", default = -23.0, minimum = -70, maximum = 0, description = "EBU R128 integrated loudness target when normalize_method is lufs.", ui = { group = "Basic", visible_if = { normalize = true, normalize_method = "lufs" } } }
remove_dc_offset = { type = "boolean", title = "Remove DC offset", default = true, description = "Subtract DC bias before further processing (On/Off).", ui = { group = "Basic" } }
preemphasis = { type = "boolean", title = "Preemphasis", default = false, description = "Apply a high-frequency pre-emphasis filter (On/Off).", ui = { group = "Advanced" } }
preemphasis_coeff = { type = "number", title = "Preemphasis coeff", default = 0.97, minimum = 0, maximum = 1, description = "First-order pre-emphasis coefficient in [0, 1] (typical 0.97).", ui = { group = "Advanced", visible_if = { preemphasis = true } } }
compress = { type = "boolean", title = "Compress", default = false, description = "Enable dynamic-range compression (On/Off).", ui = { group = "Advanced" } }
compress_threshold_db = { type = "number", title = "Compress threshold (dBFS)", default = -20.0, minimum = -96, maximum = 0, description = "Samples louder than this threshold (dBFS) are gain-reduced by compress_ratio.", ui = { group = "Advanced", visible_if = { compress = true } } }
compress_ratio = { type = "number", title = "Compress ratio", default = 4.0, exclusiveMinimum = 0, description = "Compression ratio (e.g. 4.0 means 4:1). Must be > 0; values < 1 expand.", ui = { group = "Advanced", visible_if = { compress = true } } }
limiter = { type = "boolean", title = "Limiter", default = true, description = "Hard-clip the processed output to [-1, 1] when it exceeds full scale (On/Off).", ui = { group = "Advanced" } }
skip_clipped = { type = "boolean", title = "Skip clipped", default = false, description = "Drop samples whose processed output exceeds full scale (checked after normalization/compression, before the limiter) instead of limiting them (On/Off).", ui = { group = "Advanced" } }
batch_size = { type = "integer", title = "Batch size", default = 0, minimum = 0, description = "Process in chunks of N samples (0 = all at once). Output is identical; only iteration changes.", ui = { group = "Advanced" } }
