[plugin]
name             = "audio-conditioner"
version          = "1.1.0"
description      = "Unified production-grade audio preprocessing frontend with LUFS normalization and dynamic range compression."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["nodes.py"]
license          = "MIT"

tags = [
    "audio",
    "preprocessing",
    "conditioning",
    "frontend",
    "edge-ai",
    "lufs",
    "compression"
]

dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "scipy>=1.10"
]

optional_dependencies = [
    "pyloudnorm>=0.1",
]

[config_schema.audio_conditioner]
target_sample_rate = { type = "integer", title = "Target sample rate", default = 16000, description = "Resample audio to this rate (Hz).", ui = { group = "Basic" } }
mono = { type = "boolean", title = "Mono", default = true, description = "Downmix to a single channel (On/Off).", ui = { group = "Basic" } }
trim_silence = { type = "boolean", title = "Trim silence", default = true, description = "Trim leading/trailing silence using trim_threshold_db (On/Off).", ui = { group = "Basic" } }
trim_threshold_db = { type = "number", title = "Trim threshold (dB)", default = 40.0, description = "Silence threshold in dB used when trim_silence is On.", ui = { group = "Advanced" } }
normalize = { type = "boolean", title = "Normalize", default = true, description = "Normalize feature or audio amplitude (On/Off).", ui = { group = "Basic" } }
normalize_method = { type = "string", title = "Normalize method", default = "peak", description = "Loudness normalization method. One of: peak, rms, lufs.", enum = ["peak", "rms", "lufs"], ui = { group = "Basic" } }
target_level_db = { type = "number", title = "Target level (dB)", default = -1.0, description = "Peak/RMS target level in dB when normalize_method is peak or rms.", ui = { group = "Basic" } }
target_lufs = { type = "number", title = "Target LUFS", default = -23.0, description = "EBU R128 integrated loudness target when normalize_method is lufs.", ui = { group = "Basic" } }
remove_dc_offset = { type = "boolean", title = "Remove DC offset", default = true, description = "Subtract DC bias before further processing (On/Off).", ui = { group = "Basic" } }
preemphasis = { type = "boolean", title = "Preemphasis", default = false, description = "Apply a high-frequency pre-emphasis filter (On/Off).", ui = { group = "Advanced" } }
preemphasis_coeff = { type = "number", title = "Preemphasis coeff", default = 0.97, description = "First-order pre-emphasis coefficient (typical 0.97).", ui = { group = "Advanced" } }
compress = { type = "boolean", title = "Compress", default = false, description = "Enable dynamic-range compression (On/Off).", ui = { group = "Advanced" } }
compress_threshold_db = { type = "number", title = "Compress threshold (dB)", default = -20.0, description = "Compression threshold in dB below which gain is reduced.", ui = { group = "Advanced" } }
compress_ratio = { type = "number", title = "Compress ratio", default = 4.0, description = "Compression ratio (e.g. 4.0 means 4:1). Must be > 0.", ui = { group = "Advanced" } }
limiter = { type = "boolean", title = "Limiter", default = true, description = "Brick-wall limiter to prevent clipping after processing (On/Off).", ui = { group = "Advanced" } }
skip_clipped = { type = "boolean", title = "Skip clipped", default = false, description = "Skip samples that are already clipped instead of processing them (On/Off).", ui = { group = "Advanced" } }
batch_size = { type = "integer", title = "Batch size", default = 0, description = "Process in batches of N (0 = all at once).", ui = { group = "Advanced" } }
