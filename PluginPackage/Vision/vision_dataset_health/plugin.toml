[plugin]
name             = "vision-dataset-health"
version          = "0.1.0"
description      = "Class balance / box size health"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "vision", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["vision_dataset_health"]

[config_schema.vision_dataset_health]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
min_per_class = { type = "integer", title = "Min per class", default = 20, description = "Min per class." }
flag_empty_images = { type = "boolean", title = "Flag empty images", default = true, description = "Flag empty images." }
