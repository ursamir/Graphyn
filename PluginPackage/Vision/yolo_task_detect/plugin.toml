[plugin]
name             = "yolo-task-detect"
version          = "0.1.0"
description      = "Detect-task wrapper"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "yolo"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "ultralytics>=8.0",
]

runtime = "inprocess"
node_types = ["yolo_task_detect"]

[config_schema.yolo_task_detect]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
imgsz = { type = "integer", title = "Imgsz", default = 640, description = "Imgsz." }
conf = { type = "number", title = "Conf", default = 0.25, description = "Conf." }
