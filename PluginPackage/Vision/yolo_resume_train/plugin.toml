[plugin]
name             = "yolo-resume-train"
version          = "0.1.0"
description      = "Resume YOLO training from last.pt / checkpoint"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "yolo", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "ultralytics>=8.0",
    "torch>=2.0",
]

runtime = "inprocess"
node_types = ["yolo_resume_train"]

[config_schema.yolo_resume_train]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
resume_checkpoint = { type = "string", title = "Resume checkpoint", default = "", description = "Resume checkpoint." }
extra_epochs = { type = "integer", title = "Extra epochs", default = 0, description = "Extra epochs." }
