[plugin]
name             = "yolo-nms-postprocess"
version          = "0.1.0"
description      = "Standalone NMS postprocess"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "yolo"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "ultralytics>=8.0",
    "torch>=2.0",
]

runtime = "inprocess"
node_types = ["yolo_nms_postprocess"]

[config_schema.yolo_nms_postprocess]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
iou = { type = "number", title = "Iou", default = 0.45, description = "Iou." }
conf = { type = "number", title = "Conf", default = 0.25, description = "Conf." }
max_det = { type = "integer", title = "Max det", default = 300, description = "Max det." }
