[plugin]
name             = "vision-dataset-ingest"
version          = "0.1.0"
description      = "COCO/YOLO/folder image ingest"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "vision", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "ultralytics>=8.0",
    "torch>=2.0",
]

runtime = "inprocess"
node_types = ["vision_dataset_ingest"]

[config_schema.vision_dataset_ingest]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
source_type = { type = "string", title = "Source type", default = "folder", description = "Source type." }
path = { type = "string", title = "Path", default = "", description = "Path." }
split = { type = "string", title = "Split", default = "train", description = "Split." }
