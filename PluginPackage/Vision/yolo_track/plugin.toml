[plugin]
name             = "yolo-track"
version          = "0.1.0"
description      = "ByteTrack-style multi-object track"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "yolo", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "ultralytics>=8.0",
]

runtime = "inprocess"
node_types = ["yolo_track"]

[config_schema.yolo_track]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
tracker = { type = "string", title = "Tracker", default = "bytetrack", description = "Tracker." }
track_high_thresh = { type = "number", title = "Track high thresh", default = 0.5, description = "Track high thresh." }
