[plugin]
name             = "tensorrt-infer"
version          = "0.1.0"
description      = "TensorRT engine infer"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "tensorrt", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["tensorrt_infer"]

[config_schema.tensorrt_infer]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
device = { type = "integer", title = "Device", default = 0, description = "Device." }
fp16 = { type = "boolean", title = "Fp16", default = true, description = "Fp16." }
imgsz = { type = "integer", title = "Imgsz", default = 640, description = "Imgsz." }
