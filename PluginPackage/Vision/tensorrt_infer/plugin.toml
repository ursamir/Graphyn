[plugin]
name             = "tensorrt-infer"
version          = "0.1.0"
description      = "TensorRT engine infer"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "tensorrt"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["tensorrt_infer"]

[config_schema.tensorrt_infer]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
device = { type = "string", title = "Device", default = "auto", enum = ["auto", "cpu", "cuda"], description = "Inference device passed to the engine runtime (auto lets it pick)." }
fp16 = { type = "boolean", title = "Fp16", default = true, description = "Fp16." }
imgsz = { type = "integer", title = "Imgsz", default = 640, description = "Imgsz." }
