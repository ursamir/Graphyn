[plugin]
name             = "annotation-export-coco"
version          = "0.1.0"
description      = "Export COCO JSON"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "annotation", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["annotation_export_coco"]

[config_schema.annotation_export_coco]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
output_path = { type = "string", title = "Output path", default = "workspace/datasets/vision/coco.json", description = "Output path." }
