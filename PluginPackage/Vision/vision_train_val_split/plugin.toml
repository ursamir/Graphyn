[plugin]
name             = "vision-train-val-split"
version          = "0.1.0"
description      = "Vision stratified splits"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "vision", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["vision_train_val_split"]

[config_schema.vision_train_val_split]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
split_ratios = { type = "object", title = "Split ratios", default = {}, description = "Split ratios." }
seed = { type = "integer", title = "Seed", default = 42, description = "Seed." }
