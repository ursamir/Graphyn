[plugin]
name             = "vision-augment"
version          = "0.1.0"
description      = "Mosaic/HSV/flip YOLO-style aug"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["vision", "vision", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "ultralytics>=8.0",
]

runtime = "inprocess"
node_types = ["vision_augment"]

[config_schema.vision_augment]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
mosaic = { type = "boolean", title = "Mosaic", default = true, description = "Mosaic." }
hsv_h = { type = "number", title = "Hsv h", default = 0.015, description = "Hsv h." }
fliplr = { type = "number", title = "Fliplr", default = 0.5, description = "Fliplr." }
degrees = { type = "number", title = "Degrees", default = 0.0, description = "Degrees." }
