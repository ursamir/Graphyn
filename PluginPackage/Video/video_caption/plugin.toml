[plugin]
name             = "video-caption"
version          = "0.1.0"
description      = "VL caption for clips/frames"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["video", "video", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "torch>=2.0",
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["video_caption"]

[config_schema.video_caption]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
backend = { type = "string", title = "Backend", default = "blip", description = "Backend." }
api_secret_name = { type = "string", title = "Api secret name", default = "OPENAI_API_KEY", description = "Api secret name." }
max_frames = { type = "integer", title = "Max frames", default = 8, description = "Max frames." }
