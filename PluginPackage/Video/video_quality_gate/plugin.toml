[plugin]
name             = "video-quality-gate"
version          = "1.0.0"
description      = "Reject videos that are too short/long, low-res, low-fps, missing audio, or mostly black/frozen/silent (ffmpeg blackdetect/freezedetect/silencedetect)."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"
tags = ["video", "quality", "gate", "ffmpeg"]

# Needs the ffmpeg/ffprobe binaries on PATH (present in the Graphyn image).
dependencies = ["numpy>=1.24"]

runtime = "inprocess"
node_types = ["video_quality_gate"]

[config_schema.video_quality_gate]
min_duration_s = { type = "number", title = "Min duration (s)", default = 0.5, minimum = 0 }
max_duration_s = { type = "number", title = "Max duration (s)", default = 3600.0, minimum = 0, description = "0 = no maximum." }
min_width = { type = "integer", title = "Min width (px)", default = 0, minimum = 0 }
min_height = { type = "integer", title = "Min height (px)", default = 0, minimum = 0 }
min_fps = { type = "number", title = "Min fps", default = 0.0, minimum = 0 }
require_audio = { type = "boolean", title = "Require audio track", default = false }
max_black_ratio = { type = "number", title = "Max black ratio", default = 0.5, minimum = 0, maximum = 1, description = "Max fraction of duration that is black (1 = don't measure)." }
max_frozen_ratio = { type = "number", title = "Max frozen ratio", default = 1.0, minimum = 0, maximum = 1, description = "Max fraction of duration that is frozen (1 = don't measure)." }
max_silence_ratio = { type = "number", title = "Max silence ratio", default = 1.0, minimum = 0, maximum = 1, description = "Max fraction of duration that is silent (1 = don't measure)." }
rejection_policy = { type = "string", title = "Rejection policy", default = "skip", enum = ["skip", "flag", "fail"], description = "skip = route failures to 'rejected'; flag = pass all with verdict in metadata; fail = raise." }
