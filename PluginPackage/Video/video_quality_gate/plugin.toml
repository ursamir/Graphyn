[plugin]
name             = "video-quality-gate"
version          = "0.1.0"
description      = "Reject corrupt/short videos"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["video", "video", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "opencv-python-headless>=4.8",
]

runtime = "inprocess"
node_types = ["video_quality_gate"]

[config_schema.video_quality_gate]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
min_duration_s = { type = "number", title = "Min duration s", default = 0.5, description = "Min duration s." }
max_duration_s = { type = "number", title = "Max duration s", default = 600.0, description = "Max duration s." }
rejection_policy = { type = "string", title = "Rejection policy", default = "skip", description = "Rejection policy." }
