[plugin]
name             = "clip-segment"
version          = "0.1.0"
description      = "Cut clips from scenes/fixed windows"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["video", "clip", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "opencv-python-headless>=4.8",
]

runtime = "inprocess"
node_types = ["clip_segment"]

[config_schema.clip_segment]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
mode = { type = "string", title = "Mode", default = "scenes", description = "Mode." }
window_s = { type = "number", title = "Window s", default = 10.0, description = "Window s." }
output_dir = { type = "string", title = "Output dir", default = "workspace/datasets/video/clips", description = "Output dir." }
