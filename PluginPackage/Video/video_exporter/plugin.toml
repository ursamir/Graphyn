[plugin]
name             = "video-exporter"
version          = "0.1.0"
description      = "Export clips/annotated video"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["video", "video", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "opencv-python-headless>=4.8",
]

runtime = "inprocess"
node_types = ["video_exporter"]

[config_schema.video_exporter]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
output_dir = { type = "string", title = "Output dir", default = "workspace/datasets/output/video", description = "Output dir." }
draw_boxes = { type = "boolean", title = "Draw boxes", default = false, description = "Draw boxes." }
