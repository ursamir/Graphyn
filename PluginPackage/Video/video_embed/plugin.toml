[plugin]
name             = "video-embed"
version          = "0.1.0"
description      = "Clip-level video embeddings"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["video", "video", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "torch>=2.0",
]

runtime = "inprocess"
node_types = ["video_embed"]

[config_schema.video_embed]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
model = { type = "string", title = "Model", default = "xclip", description = "Model." }
num_frames = { type = "integer", title = "Num frames", default = 8, description = "Num frames." }
