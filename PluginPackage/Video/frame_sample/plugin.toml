[plugin]
name             = "frame-sample"
version          = "0.1.0"
description      = "Sample frames fps/every-N/keyframe"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["video", "frame"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "opencv-python-headless>=4.8",
]

runtime = "inprocess"
node_types = ["frame_sample"]

[config_schema.frame_sample]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
mode = { type = "string", title = "Mode", default = "fps", enum = ["fps", "every_n", "keyframe"], description = "Mode." }
fps = { type = "number", title = "Fps", default = 1.0, description = "Fps." }
every_n = { type = "integer", title = "Every n", default = 30, description = "Every n." }
output_dir = { type = "string", title = "Output dir", default = "workspace/datasets/video/frames", description = "Output dir." }
