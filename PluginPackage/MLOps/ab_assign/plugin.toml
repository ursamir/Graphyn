[plugin]
name             = "ab-assign"
version          = "0.1.0"
description      = "Deterministic A/B assignment"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["mlops", "ab"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["ab_assign"]

[config_schema.ab_assign]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
experiment_key = { type = "string", title = "Experiment key", default = "default", description = "Experiment key." }
variants = { type = "array", title = "Variants", default = ["control", "treatment"], description = "Variant names (unique, non-empty)." }
weights = { type = "array", title = "Weights", default = [0.5, 0.5], description = "Non-negative weights, one per variant (empty = uniform)." }
unit_id_field = { type = "string", title = "Unit id field", default = "unit_id", description = "Field holding the unit id when the input is a record; missing field is an error." }
