[plugin]
name             = "canary-gate"
version          = "0.1.0"
description      = "Canary promote/hold gate"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["mlops", "canary"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["canary_gate"]

[config_schema.canary_gate]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
metric_key = { type = "string", title = "Metric key", default = "test_accuracy", description = "Metric key." }
min_value = { type = "number", title = "Min value", default = 0.0, description = "Hold when metric < min_value (None disables)." }
max_value = { type = "number", title = "Max value", description = "Hold when metric > max_value (None disables)." }
max_regression = { type = "number", title = "Max regression", default = 0.02, description = "Hold when metric regresses more than this vs baseline (baseline port or baseline_value)." }
baseline_value = { type = "number", title = "Baseline value", description = "Baseline metric when no baseline input is wired." }
higher_is_better = { type = "boolean", title = "Higher is better", default = true, description = "Direction of the metric (False for loss-like metrics)." }
