[plugin]
name             = "ship-package-transition"
version          = "0.1.0"
description      = "Transition ship status"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["mlops", "ship", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["ship_package_transition"]

[config_schema.ship_package_transition]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
action = { type = "string", title = "Action", default = "validate", description = "Action." }
resource_version = { type = "string", title = "Resource version", default = "", description = "Resource version." }
