[plugin]
name             = "ship-package-promote"
version          = "0.1.0"
description      = "Promote draft→staging→prod"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["mlops", "ship", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["ship_package_promote"]

[config_schema.ship_package_promote]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
to_env = { type = "string", title = "To env", default = "staging", description = "To env." }
approve = { type = "boolean", title = "Approve", default = false, description = "Approve." }
