[plugin]
name             = "feature-store-write"
version          = "0.1.0"
description      = "Light feature store write"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["mlops", "feature"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["feature_store_write"]

[config_schema.feature_store_write]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
persist_path = { type = "string", title = "Persist path", default = "workspace/artifacts/feature_store", description = "JSON store file path." }
entity_keys = { type = "array", title = "Entity keys", default = ["id"], description = "Row fields forming the entity key (missing field is an error). [] keys rows by content hash." }
event_time_field = { type = "string", title = "Event time field", default = "", description = "Row field holding an ISO event time (used by feature_store_read as_of). Empty: write time." }
