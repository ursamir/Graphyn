[plugin]
name             = "ship-package-create"
version          = "0.1.0"
description      = "Create ship package (REST semantics)"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["mlops", "ship"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["ship_package_create"]

[config_schema.ship_package_create]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
project = { type = "string", title = "Project", default = "", description = "Empty: use the input's project, else 'default'." }
model_name = { type = "string", title = "Model name", default = "", description = "Empty: use the input's model_name, else 'model'." }
model_stage_or_version = { type = "string", title = "Model stage or version", default = "", description = "Empty: use the input's value, else 'latest'." }
target = { type = "object", title = "Target", default = {}, description = "Target object (runtime/arch/...). Empty: use the input's target, else python/cpu." }
env = { type = "string", title = "Env", default = "draft", description = "Env." }
unsigned_allowed = { type = "boolean", title = "Unsigned allowed", default = true, description = "Unsigned allowed." }
