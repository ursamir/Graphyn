[plugin]
name             = "drift-detect"
version          = "0.1.0"
description      = "Feature/prediction drift"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["mlops", "drift"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["drift_detect"]

[config_schema.drift_detect]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
method = { type = "string", title = "Method", default = "psi", enum = ["psi", "ks"], description = "psi: population stability index on reference-quantile bins; ks: two-sample KS statistic." }
threshold = { type = "number", title = "Threshold", default = 0.2, description = "A feature drifts when its score >= threshold (psi value or KS D)." }
bins = { type = "integer", title = "Bins", default = 10, description = "PSI quantile bins (reference-derived)." }
split = { type = "string", title = "Split", default = "all", enum = ["all", "train", "val", "test"], description = "DatasetArtifact split(s) to compare." }
