[plugin]
name             = "drift-detect"
version          = "0.1.0"
description      = "Feature/prediction drift"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["mlops", "drift", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["drift_detect"]

[config_schema.drift_detect]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
method = { type = "string", title = "Method", default = "psi", description = "Method." }
threshold = { type = "number", title = "Threshold", default = 0.2, description = "Threshold." }
