[plugin]
name             = "mcu-label-taxonomy"
version          = "0.1.0"
description      = "MCU class taxonomy remap"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "mcu", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["mcu_label_taxonomy"]

[config_schema.mcu_label_taxonomy]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
taxonomy = { type = "object", title = "Taxonomy", default = {}, description = "Taxonomy." }
drop_unknown = { type = "boolean", title = "Drop unknown", default = true, description = "Drop unknown." }
