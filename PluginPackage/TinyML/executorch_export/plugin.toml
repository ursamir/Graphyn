[plugin]
name             = "executorch-export"
version          = "0.1.0"
description      = "ExecuTorch .pte + Arm TOSA path"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "executorch", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "torch>=2.0",
]

runtime = "inprocess"
node_types = ["executorch_export"]

[config_schema.executorch_export]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
backend = { type = "string", title = "Backend", default = "xnnpack", description = "Backend." }
quantization = { type = "string", title = "Quantization", default = "int8", description = "Quantization." }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/optimized/pte", description = "Output path." }
pte_filename = { type = "string", title = "Pte filename", default = "model.pte", description = "Pte filename." }
