[plugin]
name             = "tflm-host-sim"
version = "0.2.0"
description      = "Host TFLM/TFLite interpreter eval"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "tflm", "wave1"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "tensorflow>=2.13",
    "tflite-runtime>=2.14",
]

runtime = "isolated"
node_types = ["tflm_host_sim"]

[config_schema.tflm_host_sim]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
interpreter = { type = "string", title = "Interpreter", default = "tflite_runtime", description = "Interpreter." }
batch_limit = { type = "integer", title = "Batch limit", default = 0, description = "Batch limit." }
