[plugin]
name             = "mcu-window"
version          = "0.1.0"
description      = "Fixed/sliding windowing for MCU audio/IMU streams"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "mcu"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["mcu_window"]

[config_schema.mcu_window]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
window_ms = { type = "integer", title = "Window ms", default = 1000, description = "Window ms." }
hop_ms = { type = "integer", title = "Hop ms", default = 200, description = "Hop ms." }
sample_rate = { type = "integer", title = "Sample rate", default = 16000, description = "Target sample rate; input audio is resampled to this rate before windowing." }
max_windows = { type = "integer", title = "Max windows", default = 0, description = "Maximum windows per sample (0 = unlimited)." }
