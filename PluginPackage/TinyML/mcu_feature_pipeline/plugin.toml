[plugin]
name             = "mcu-feature-pipeline"
version          = "0.1.0"
description      = "MCU-RAM MFCC/spectrogram/IMU features"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "mcu"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["mcu_feature_pipeline"]

[config_schema.mcu_feature_pipeline]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
feature_type = { type = "string", title = "Feature type", default = "mfcc", enum = ["mfcc", "spectrogram"], description = "Feature type." }
n_mfcc = { type = "integer", title = "N mfcc", default = 10, description = "N mfcc." }
n_mels = { type = "integer", title = "N mels", default = 40, description = "N mels." }
fixed_length = { type = "integer", title = "Fixed length", default = 49, description = "Fixed length." }
max_ram_kb = { type = "integer", title = "Max ram kb", default = 256, description = "Max ram kb." }
max_windows = { type = "integer", title = "Max windows", default = 0, description = "Maximum spectrogram frames per sample (0 = unlimited)." }
