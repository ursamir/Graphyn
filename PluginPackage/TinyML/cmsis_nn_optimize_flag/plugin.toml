[plugin]
name             = "cmsis-nn-optimize-flag"
version          = "0.1.0"
description      = "Stamp CMSIS-NN optimize metadata"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "cmsis", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["cmsis_nn_optimize_flag"]

[config_schema.cmsis_nn_optimize_flag]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
enable = { type = "boolean", title = "Enable", default = true, description = "Enable." }
kernel_variant = { type = "string", title = "Kernel variant", default = "auto", description = "Kernel variant." }
