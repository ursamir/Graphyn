[plugin]
name             = "mcu-mfcc"
version          = "0.1.0"
description      = "MCU-friendly MFCC feature extract"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "mcu"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["mcu_mfcc"]

[config_schema.mcu_mfcc]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
n_mfcc = { type = "integer", title = "N mfcc", default = 13, description = "N mfcc." }
n_fft = { type = "integer", title = "N fft", default = 512, description = "N fft." }
hop_length = { type = "integer", title = "Hop length", default = 160, description = "Hop length." }
