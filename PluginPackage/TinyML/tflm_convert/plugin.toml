[plugin]
name             = "tflm-convert"
version = "0.2.0"
description      = "Convert→.tflite micro + CMSIS-NN metadata"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "tflm"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "tensorflow>=2.13",
    "tflite-runtime>=2.14",
]

runtime = "isolated"
node_types = ["tflm_convert"]

[config_schema.tflm_convert]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
cmsis_nn = { type = "boolean", title = "Cmsis nn", default = true, description = "Cmsis nn." }
optimize_for = { type = "string", title = "Optimize for", default = "cortex_m55", description = "Optimize for." }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/optimized/tflite_micro", description = "Output path." }
