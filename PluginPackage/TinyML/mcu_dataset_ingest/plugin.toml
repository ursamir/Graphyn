[plugin]
name             = "mcu-dataset-ingest"
version          = "0.1.0"
description      = "IMU/audio/image MCU dataset ingest"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "mcu", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["mcu_dataset_ingest"]

[config_schema.mcu_dataset_ingest]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
source_type = { type = "string", title = "Source type", default = "filesystem", description = "Source type." }
modalities = { type = "array", title = "Modalities", default = [], description = "Modalities." }
window_ms = { type = "integer", title = "Window ms", default = 1000, description = "Window ms." }
sample_rate = { type = "integer", title = "Sample rate", default = 16000, description = "Sample rate." }
path = { type = "string", title = "Path", default = "", description = "Path." }
