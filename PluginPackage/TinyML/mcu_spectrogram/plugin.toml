[plugin]
name             = "mcu-spectrogram"
version          = "0.1.0"
description      = "MCU-friendly spectrogram / log-mel features"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "mcu", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["mcu_spectrogram"]

[config_schema.mcu_spectrogram]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
n_mels = { type = "integer", title = "N mels", default = 40, description = "N mels." }
n_fft = { type = "integer", title = "N fft", default = 512, description = "N fft." }
hop_length = { type = "integer", title = "Hop length", default = 160, description = "Hop length." }
