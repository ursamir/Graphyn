[plugin]
name             = "tflm-quantize"
version = "0.2.0"
description      = "Int8/int16 TFLM-compatible quantize"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "tflm"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "tensorflow>=2.13",
]

runtime = "isolated"
node_types = ["tflm_quantize"]

[config_schema.tflm_quantize]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
quantization = { type = "string", title = "Quantization", default = "int8", enum = ["int8", "dynamic"], description = "Quantization." }
full_integer = { type = "boolean", title = "Full integer", default = true, description = "Full integer." }
representative_samples = { type = "integer", title = "Representative samples", default = 100, description = "Representative samples." }
ensure_tflm_ops = { type = "boolean", title = "Ensure tflm ops", default = true, description = "Ensure tflm ops." }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/optimized/tflm", description = "Output path." }
