[plugin]
name             = "mcu-glue-stubs"
version          = "0.1.0"
description      = "Arduino/Zephyr/FreeRTOS glue stubs"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["tinyml", "mcu", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["mcu_glue_stubs"]

[config_schema.mcu_glue_stubs]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
framework = { type = "string", title = "Framework", default = "arduino", description = "Framework." }
board = { type = "string", title = "Board", default = "", description = "Board." }
output_path = { type = "string", title = "Output path", default = "workspace/artifacts/packages/glue", description = "Output path." }
