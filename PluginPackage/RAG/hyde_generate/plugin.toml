[plugin]
name             = "hyde-generate"
version          = "0.1.0"
description      = "HyDE: generate hypothetical document for embedding-based retrieve"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "hyde", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["hyde_generate"]

[config_schema.hyde_generate]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
model = { type = "string", title = "Model", default = "", description = "Model." }
api_secret_name = { type = "string", title = "Api secret name", default = "", description = "Api secret name." }
max_tokens = { type = "integer", title = "Max tokens", default = 256, description = "Max tokens." }
