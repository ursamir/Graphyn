[plugin]
name             = "rag-slack-connector"
version          = "0.1.0"
description      = "Slack history connector (secret)"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "rag", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["rag_slack_connector"]

[config_schema.rag_slack_connector]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
secret_name = { type = "string", title = "Secret name", default = "SLACK_BOT_TOKEN", description = "Secret name." }
channel_ids = { type = "array", title = "Channel ids", default = [], description = "Channel ids." }
