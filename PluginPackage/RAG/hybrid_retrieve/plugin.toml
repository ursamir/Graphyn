[plugin]
name             = "hybrid-retrieve"
version          = "0.1.0"
description      = "BM25+dense hybrid with RRF"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "hybrid", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["hybrid_retrieve"]

[config_schema.hybrid_retrieve]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
top_k = { type = "integer", title = "Top k", default = 10, description = "Top k." }
dense_weight = { type = "number", title = "Dense weight", default = 0.5, description = "Dense weight." }
bm25_weight = { type = "number", title = "Bm25 weight", default = 0.5, description = "Bm25 weight." }
rrf_k = { type = "integer", title = "Rrf k", default = 60, description = "Rrf k." }
