[plugin]
name             = "rag-eval"
version          = "0.1.0"
description      = "Ragas-style faithfulness/relevancy/precision"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "rag"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["rag_eval"]

[config_schema.rag_eval]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
metrics = { type = "array", title = "Metrics", default = [], description = "Metrics." }
judge_model = { type = "string", title = "Judge model", default = "gpt-4o-mini", description = "Judge model." }
fail_below = { type = "object", title = "Fail below", default = {}, description = "Fail below." }
