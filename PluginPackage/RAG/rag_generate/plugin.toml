[plugin]
name             = "rag-generate"
version          = "0.2.0"
description      = "Generate RAG answer via stub, OpenAI-compatible HTTP, or Ollama local."
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "llm", "openai", "ollama"]

dependencies = []

optional_dependencies = [
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["rag_generate"]

[config_schema.rag_generate]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true, return stub answer (no network)." }
provider = { type = "string", title = "Provider", default = "stub", description = "stub | openai_compat | ollama", enum = ["stub", "openai_compat", "ollama"] }
model = { type = "string", title = "Model", default = "gpt-4o-mini", description = "Chat model id." }
temperature = { type = "number", title = "Temperature", default = 0.0, description = "Sampling temperature." }
api_secret_name = { type = "string", title = "API secret name", default = "OPENAI_API_KEY", description = "Secret/env for openai_compat." }
base_url = { type = "string", title = "Base URL", default = "", description = "OpenAI-compatible base URL override." }
timeout_s = { type = "number", title = "Timeout (s)", default = 60.0, description = "HTTP timeout seconds." }
