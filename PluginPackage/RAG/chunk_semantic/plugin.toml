[plugin]
name             = "chunk-semantic"
version = "0.2.0"
description      = "Semantic breakpoint chunker"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "wave1"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "torch>=2.0",
    "sentence-transformers>=2.2",
]

runtime = "inprocess"
node_types = ["chunk_semantic"]

[config_schema.chunk_semantic]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
embedding_model = { type = "string", title = "Embedding model", default = "sentence-transformers/all-MiniLM-L6-v2", description = "Embedding model." }
breakpoint_percentile = { type = "number", title = "Breakpoint percentile", default = 95.0, description = "Breakpoint percentile." }
