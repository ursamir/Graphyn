[plugin]
name             = "kg-light-extract"
version          = "0.1.0"
description      = "Light entity/relation extract"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "kg"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["kg_light_extract"]

[config_schema.kg_light_extract]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
backend = { type = "string", title = "Backend", default = "pattern", enum = ["pattern", "llm"], description = "pattern: regex triple extraction. llm is declared but not implemented yet and raises." }
entity_schema = { type = "object", title = "Entity schema", default = {}, description = "Optional entity/relation schema hints for extraction." }
api_secret_name = { type = "string", title = "Api secret name", default = "OPENAI_API_KEY", description = "Api secret name." }
