[plugin]
name             = "rag-notion-connector"
version          = "0.1.0"
description      = "Notion connector (secret)"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "rag"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["rag_notion_connector"]

[config_schema.rag_notion_connector]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
secret_name = { type = "string", title = "Secret name", default = "NOTION_API_TOKEN", description = "Secret name." }
database_id = { type = "string", title = "Database id", default = "", description = "Database id." }
