[plugin]
name             = "bm25-index-build"
version = "0.2.0"
description      = "Build BM25 sparse index for hybrid retrieval"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "bm25"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["bm25_index_build"]

[config_schema.bm25_index_build]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
backend = { type = "string", title = "Backend", default = "rank_bm25", enum = ["rank_bm25", "pure_python"], description = "rank_bm25 (library) or pure_python BM25." }
k1 = { type = "number", title = "K1", default = 1.5, description = "K1." }
b = { type = "number", title = "B", default = 0.75, description = "B." }
