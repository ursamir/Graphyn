[plugin]
name             = "chunk-hierarchical"
version          = "0.1.0"
description      = "Parent/child hierarchical chunks"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "chunk", "stub"]

dependencies = [
    "numpy>=1.24",
]

runtime = "inprocess"
node_types = ["chunk_hierarchical"]

[config_schema.chunk_hierarchical]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
parent_size = { type = "integer", title = "Parent size", default = 2000, description = "Parent size." }
child_size = { type = "integer", title = "Child size", default = 400, description = "Child size." }
