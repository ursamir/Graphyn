[plugin]
name             = "contextual-compress"
version          = "0.1.0"
description      = "Compress context to query-relevant spans"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "contextual"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["contextual_compress"]

[config_schema.contextual_compress]
stub = { type = "boolean", title = "Stub mode", default = false, description = "Opt-in placeholder. Default runs the real implementation." }
backend = { type = "string", title = "Backend", default = "extractive", enum = ["extractive", "truncate"], description = "extractive: BM25-rank hits vs query then truncate; truncate: keep input order, truncate each hit." }
max_chars = { type = "integer", title = "Max chars", default = 2000, description = "Max chars." }
