[plugin]
name             = "contextual-compress"
version          = "0.1.0"
description      = "Compress context to query-relevant spans"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "contextual", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "httpx>=0.24",
]

runtime = "inprocess"
node_types = ["contextual_compress"]

[config_schema.contextual_compress]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
backend = { type = "string", title = "Backend", default = "extractive", description = "Backend." }
max_chars = { type = "integer", title = "Max chars", default = 2000, description = "Max chars." }
