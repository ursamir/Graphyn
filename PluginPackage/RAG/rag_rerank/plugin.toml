[plugin]
name             = "rag-rerank"
version          = "0.1.0"
description      = "Cross-encoder/LLM rerank"
author           = "Graphyn Plugins"
platform_version = ">=0.0"
entry_points     = ["types.py", "nodes.py"]
license          = "MIT"

tags = ["rag", "rag", "stub"]

dependencies = [
    "numpy>=1.24",
]

optional_dependencies = [
    "torch>=2.0",
    "sentence-transformers>=2.2",
]

runtime = "inprocess"
node_types = ["rag_rerank"]

[config_schema.rag_rerank]
stub = { type = "boolean", title = "Stub mode", default = true, description = "When true (default), return typed minimal outputs without heavy ML deps." }
backend = { type = "string", title = "Backend", default = "cross_encoder", description = "Backend." }
model_name_or_path = { type = "string", title = "Model name or path", default = "cross-encoder/ms-marco-MiniLM-L-6-v2", description = "Model name or path." }
top_n = { type = "integer", title = "Top n", default = 5, description = "Top n." }
