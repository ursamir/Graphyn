name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke (deps + tests + templates)
        run: bash scripts/ci_smoke.sh

  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: graphyn-ui/package-lock.json
      - name: Build console
        run: bash scripts/ui_build.sh
      - name: Unit test API client
        working-directory: graphyn-ui
        run: npm test
