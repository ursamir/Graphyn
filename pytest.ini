[pytest]
testpaths = unit_test
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    offline: unit tests that must not require optional ML backends (torch/tf/espeak/…)
    backend: tests that exercise real optional backends (skip unless deps installed)
    heavy: loads torch/transformers models in-process (can segfault in torch/triton); skipped unless GRAPHYN_RUN_HEAVY=1
    requires_plugins: needs the populated plugin registry; skipped when GRAPHYN_SKIP_PLUGIN_LOAD=1
    slow: slow test (catalog-wide sweeps)
filterwarnings =
    ignore::DeprecationWarning
