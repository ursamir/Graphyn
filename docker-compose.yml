# Production-ish local deploy: API + UI. Auth is fail-closed.
# GPU (optional, does not evict other apps):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d graphyn-api
# Default compose is CPU-safe: no NVIDIA device requests, so FaceRecognition
# (or any other host GPU process) keeps the card unless you opt in.
#
# You MUST set GRAPHYN_API_TOKEN (API/MCP reject empty tokens when AUTH_REQUIRED=1).
#
#   cp .env.example .env   # edit token (Compose loads .env for ${GRAPHYN_API_TOKEN})
#   docker compose up --build
#
# UI: http://localhost:5173  (nginx proxies /api to the API)
# API: http://localhost:8001/api/v1/
# Docker Compose only — this repo does not ship a Helm chart.
# Prove IDE loop: scripts/docker_ide_loop_smoke.sh

# MCP SDK pin: do NOT `pip install mcp` unconstrained inside the API image —
# it can upgrade fastapi/starlette and break graphyn-api. Prefer host venv
# (`pip install -e ".[mcp]"` → mcp==1.27.0) or bake the pinned extra only.

services:
  graphyn-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphyn-api
    ports:
      - "8001:8001"
    environment:
      GRAPHYN_ENV: production
      GRAPHYN_AUTH_REQUIRED: "1"
      GRAPHYN_API_TOKEN: ${GRAPHYN_API_TOKEN:-}
      GRAPHYN_HOME: /data/graphyn-home
      GRAPHYN_PROJECT_DIR: /app/workspace
      GRAPHYN_PLUGINS_DIR: /app/plugins
      GRAPHYN_AUTO_INSTALL_PLUGINS: "1"
      # Bind-mounted workspace often uses host symlinks under datasets/input.
      GRAPHYN_DATA_ALLOW_EXTERNAL_SYMLINKS: ${GRAPHYN_DATA_ALLOW_EXTERNAL_SYMLINKS:-1}
      # API binds immediately; plugins load in a background thread.
      # Isolated ML plugins (trainer, …) install TensorFlow/Keras into their
      # venvs at load by default. Set GRAPHYN_ISOLATED_BOOT_HEAVY=0 to defer.
      GRAPHYN_ISOLATED_BOOT_HEAVY: ${GRAPHYN_ISOLATED_BOOT_HEAVY:-1}
      # Wave-1 capability venvs (host install script → volume / bind).
      # Prefer CPU torch when FaceRecognition holds the GPU.
      GRAPHYN_WAVE1_FORCE_CPU: ${GRAPHYN_WAVE1_FORCE_CPU:-1}
      GRAPHYN_WAVE1_VENVS_ROOT: ${GRAPHYN_WAVE1_VENVS_ROOT:-}
      GRAPHYN_WAVE1_VENV_VISION: ${GRAPHYN_WAVE1_VENV_VISION:-}
      GRAPHYN_WAVE1_VENV_TINYML: ${GRAPHYN_WAVE1_VENV_TINYML:-}
      GRAPHYN_WAVE1_VENV_RAG: ${GRAPHYN_WAVE1_VENV_RAG:-}
      GRAPHYN_ISOLATED_INSTALL_TORCH: ${GRAPHYN_ISOLATED_INSTALL_TORCH:-0}
      GRAPHYN_ISOLATED_INSTALL_ALL_OPTIONAL: ${GRAPHYN_ISOLATED_INSTALL_ALL_OPTIONAL:-0}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-}
      # Host Ollama (docker bridge gateway). Prefer small CPU-friendly models.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://172.17.0.1:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-tinyllama:1.1b}
      OLLAMA_NUM_GPU: ${OLLAMA_NUM_GPU:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GRAPHYN_SMTP_HOST: ${GRAPHYN_SMTP_HOST:-}
      GRAPHYN_SMTP_PORT: ${GRAPHYN_SMTP_PORT:-587}
      GRAPHYN_SMTP_USER: ${GRAPHYN_SMTP_USER:-}
      GRAPHYN_SMTP_PASSWORD: ${GRAPHYN_SMTP_PASSWORD:-}
      GRAPHYN_SMTP_FROM: ${GRAPHYN_SMTP_FROM:-}
      GRAPHYN_SMTP_TLS: ${GRAPHYN_SMTP_TLS:-1}
      GRAPHYN_SMTP_DRY_RUN: ${GRAPHYN_SMTP_DRY_RUN:-1}
      GRAPHYN_NOTIFY_EMAIL_TO: ${GRAPHYN_NOTIFY_EMAIL_TO:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - graphyn-home:/data/graphyn-home
      - ./workspace:/app/workspace
      - ./plugins:/app/plugins
    restart: unless-stopped

  graphyn-ui:
    build:
      context: .
      dockerfile: graphyn-ui/Dockerfile
    container_name: graphyn-ui
    ports:
      - "5173:80"
    depends_on:
      - graphyn-api
    restart: unless-stopped

volumes:
  graphyn-home:
