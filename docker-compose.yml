version: "3.9"

# Production-ish local deploy: API + UI. Auth is fail-closed.
# GPU (optional, does not evict other apps):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d graphyn-api
# Default compose is CPU-safe: no NVIDIA device requests, so FaceRecognition
# (or any other host GPU process) keeps the card unless you opt in.
#
# You MUST set GRAPHYN_API_TOKEN (API/MCP reject empty tokens when AUTH_REQUIRED=1).
#
#   export GRAPHYN_API_TOKEN=change-me
#   docker compose up --build
#
# UI: http://localhost:5173  (nginx proxies /api to the API)
# API: http://localhost:8001/api/v1/
# Docker Compose only — this repo does not ship a Helm chart.

services:
  graphyn-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphyn-api
    ports:
      - "8001:8001"
    environment:
      GRAPHYN_ENV: production
      GRAPHYN_AUTH_REQUIRED: "1"
      GRAPHYN_API_TOKEN: ${GRAPHYN_API_TOKEN:-}
      GRAPHYN_HOME: /data/graphyn-home
      GRAPHYN_PROJECT_DIR: /app/workspace
      GRAPHYN_AUTO_INSTALL_PLUGINS: "1"
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-}
    volumes:
      - graphyn-home:/data/graphyn-home
      - ./workspace:/app/workspace
      - ./plugins:/app/plugins
    restart: unless-stopped

  graphyn-ui:
    build:
      context: .
      dockerfile: graphyn-ui/Dockerfile
    container_name: graphyn-ui
    ports:
      - "5173:80"
    depends_on:
      - graphyn-api
    restart: unless-stopped

volumes:
  graphyn-home:
