server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dataset / plugin uploads go through /api/ — nginx's 1m default would 413.
    client_max_body_size 2g;

    location /api/ {
        proxy_pass http://graphyn-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Actor $http_x_actor;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NDJSON (/pipelines/run) and SSE (ingest, events) must reach the
        # browser as they are produced, not when a proxy buffer fills.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        # Long pipeline runs / ingest streams: allow up to 1h between bytes.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /files/ {
        proxy_pass http://graphyn-api:8001;
        proxy_set_header Authorization $http_authorization;
    }

    location /input-files/ {
        proxy_pass http://graphyn-api:8001;
        proxy_set_header Authorization $http_authorization;
    }

    location /run-files/ {
        proxy_pass http://graphyn-api:8001;
        proxy_set_header Authorization $http_authorization;
    }

    # Hashed build assets: cache forever, and a missing file is a real 404.
    # (The SPA fallback used to answer old /assets/index-<hash>.js requests
    # with index.html as text/html, so a browser holding a cached index.html
    # from a previous deploy got a silent blank page.)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA shell must always be revalidated so a redeploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
